[defaults]
inventory            = inventory.ini
host_key_checking    = False
interpreter_python   = /usr/bin/python3
# ansible-core 2.13+ : callback 'yaml' ของ community.general ถูกถอดออกแล้ว
# (หายไปใน community.general 12.0.0) ใช้ result_format ของ callback built-in แทน
stdout_callback      = default
result_format        = yaml
display_skipped_hosts = False
forks                = 6

[ssh_connection]
pipelining = True
