# =============================================================================
#  container-runtime.yml — แทนบทที่ 02
# =============================================================================
#  รัน:   ansible-playbook container-runtime.yml --check --diff --limit <host>
#         ansible-playbook container-runtime.yml --limit <host>
#
#  ต้องผ่าน prepare-os.yml มาก่อน
#
#  ⚠️ ก่อนรัน ต้องรู้ก่อนว่า registry เป็น HTTP หรือ HTTPS แล้วตั้งใน group_vars/all.yml
#     ตรวจด้วย:  curl -sI https://registry.myhr.co.th/v2/ || curl -sI http://registry.myhr.co.th/v2/
#
#  ⚠️ ทุก node ต้องออกอินเทอร์เน็ตไปที่ github.com ได้ — playbook ดาวน์โหลดตรงจาก
#     upstream เหมือนที่คู่มือทำ ถ้า node ออกไม่ได้ ให้ scp ไฟล์ไปวางที่ /root/k8s/dl/
#     เองก่อน แล้ว task ดาวน์โหลดจะข้ามให้เอง
# =============================================================================
---
- name: ติดตั้ง container runtime
  hosts: k8s_nodes
  gather_facts: true
  vars:
    dl: /root/k8s/dl

  # ---------------------------------------------------------------------------
  #  โหลด versions.env ก่อนทุกอย่าง
  # ---------------------------------------------------------------------------
  #  ต้องอยู่ใน play เดียวกับ node ไม่ใช่แยก play ที่ hosts: localhost
  #  เพราะ --limit จะตัด play ของ localhost ทิ้งไปด้วย แล้ว v จะไม่มีอยู่จริง
  # ---------------------------------------------------------------------------
  pre_tasks:
    - name: อ่าน versions.env ด้วย bash — ใช้ semantics เดียวกับคู่มือ
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          set -a && source "{{ versions_env }}" && set +a
          grep -oE '^[A-Z][A-Z0-9_]*=' "{{ versions_env }}" | tr -d '=' | sort -u \
            | while read -r k; do printf '%s: "%s"\n' "$k" "${!k}"; done
      delegate_to: localhost
      run_once: true
      become: false
      register: _ver_raw
      changed_when: false
      # อ่านอย่างเดียว — ต้องรันแม้ใน --check ไม่งั้นตัวแปรหายทั้งชุด
      check_mode: false

    - name: แปลงเป็นตัวแปร v
      ansible.builtin.set_fact:
        v: "{{ _ver_raw.stdout | from_yaml }}"

    - name: แสดงเวอร์ชันที่จะติดตั้ง
      ansible.builtin.debug:
        msg: >-
          containerd={{ v.CONTAINERD_VERSION }} runc={{ v.RUNC_VERSION }}
          cni={{ v.CNI_PLUGINS_VERSION }} k8s={{ v.K8S_VERSION }}
      run_once: true

    - name: registry_scheme ต้องตั้งไว้ให้ถูกก่อน
      ansible.builtin.assert:
        that:
          - registry_scheme in ['http', 'https']
        fail_msg: >-
          registry_scheme = '{{ registry_scheme | default("(ไม่ได้ตั้ง)") }}'
          → ต้องเป็น http หรือ https · ยืนยันของจริงก่อนด้วย
          curl -sI https://{{ v.REGISTRY_HOST }}/v2/ || curl -sI http://{{ v.REGISTRY_HOST }}/v2/
        quiet: true
      run_once: true

  tasks:
    # -------------------------------------------------------------------------
    #  0 · ต้องมีของให้ติดตั้ง — ออกเน็ตได้ หรือมีไฟล์วางไว้แล้ว
    # -------------------------------------------------------------------------
    - name: node ออกไป github.com ได้ไหม
      ansible.builtin.uri:
        url: https://github.com
        method: HEAD
        timeout: 10
      register: _net
      failed_when: false
      changed_when: false
      check_mode: false

    - name: มีไฟล์ที่ scp มาวางไว้แล้วหรือยัง
      ansible.builtin.stat:
        path: "{{ dl }}/containerd.tar.gz"
      register: _have_tar
      check_mode: false

    - name: ต้องมีทางใดทางหนึ่ง ไม่งั้นหยุดตรงนี้ดีกว่าไปตายกลางทาง
      ansible.builtin.assert:
        that:
          - (_net.status | default(0)) in [200, 301, 302] or _have_tar.stat.exists
        fail_msg: >-
          node นี้ออกไป github.com ไม่ได้ และไม่มีไฟล์ที่ {{ dl }}/containerd.tar.gz
          → โหลดจากเครื่องที่ออกเน็ตได้แล้ว scp มาวางที่ {{ dl }}/ ก่อน (บท 02 ข้อ 1)
        quiet: true

    - name: สรุปว่าจะดาวน์โหลดหรือใช้ของที่วางไว้
      ansible.builtin.set_fact:
        _online: "{{ (_net.status | default(0)) in [200, 301, 302] }}"

    # -------------------------------------------------------------------------
    #  1 · ดาวน์โหลด + ตรวจ checksum
    # -------------------------------------------------------------------------
    - name: สร้างที่เก็บไฟล์ดาวน์โหลด
      ansible.builtin.file:
        path: "{{ dl }}"
        state: directory
        mode: "0755"

    - name: ดึง checksum ของ containerd มาก่อน
      ansible.builtin.get_url:
        url: "https://github.com/containerd/containerd/releases/download/v{{ v.CONTAINERD_VERSION }}/containerd-{{ v.CONTAINERD_VERSION }}-linux-amd64.tar.gz.sha256sum"
        dest: "{{ dl }}/containerd.sha256sum"
        mode: "0644"
      when: _online

    - name: อ่านค่า checksum
      ansible.builtin.command: "awk '{print $1}' {{ dl }}/containerd.sha256sum"
      register: _sha
      changed_when: false
      # ใน --check หรือกรณี offline ไฟล์อาจยังไม่มี — ปล่อยผ่านแล้วข้ามการตรวจ checksum
      failed_when: false
      check_mode: false

    - name: ดาวน์โหลด containerd — get_url ตรวจ checksum ให้เอง ถ้าไม่ตรงจะ fail
      ansible.builtin.get_url:
        url: "https://github.com/containerd/containerd/releases/download/v{{ v.CONTAINERD_VERSION }}/containerd-{{ v.CONTAINERD_VERSION }}-linux-amd64.tar.gz"
        dest: "{{ dl }}/containerd.tar.gz"
        checksum: "{{ ('sha256:' + _sha.stdout) if (_sha.stdout | default('')) else omit }}"
        mode: "0644"
      when: _online

    - name: ดาวน์โหลด runc
      ansible.builtin.get_url:
        url: "https://github.com/opencontainers/runc/releases/download/v{{ v.RUNC_VERSION }}/runc.amd64"
        dest: "{{ dl }}/runc.amd64"
        mode: "0755"
      when: _online

    - name: ดาวน์โหลด CNI plugins
      ansible.builtin.get_url:
        url: "https://github.com/containernetworking/plugins/releases/download/v{{ v.CNI_PLUGINS_VERSION }}/cni-plugins-linux-amd64-v{{ v.CNI_PLUGINS_VERSION }}.tgz"
        dest: "{{ dl }}/cni-plugins.tgz"
        mode: "0644"
      when: _online

    - name: ดาวน์โหลด systemd unit ของ containerd
      ansible.builtin.get_url:
        # ไม่ได้อยู่ใน release asset — อยู่ในซอร์สตาม tag (ยืนยันแล้วว่า v2.2.7 มีจริง)
        url: "https://raw.githubusercontent.com/containerd/containerd/v{{ v.CONTAINERD_VERSION }}/containerd.service"
        dest: "{{ dl }}/containerd.service"
        mode: "0644"
      when: _online

    # -------------------------------------------------------------------------
    #  2 · ติดตั้ง — เทียบ "เวอร์ชันที่ติดตั้งอยู่" ไม่ใช่ดูแค่ว่ามีไฟล์
    # -------------------------------------------------------------------------
    #  ใช้ creates: ไม่ได้ เพราะมันดูแค่ว่าไฟล์มีอยู่ไหม พอ bump เวอร์ชันใน
    #  versions.env แล้ว playbook จะไม่ทำอะไรเลย — เงียบและหลอกมาก
    # -------------------------------------------------------------------------
    - name: containerd ที่ติดตั้งอยู่เป็นเวอร์ชันไหน
      ansible.builtin.command: containerd --version
      register: _ctd_cur
      changed_when: false
      failed_when: false
      check_mode: false

    - name: แตก containerd ลง /usr/local
      ansible.builtin.unarchive:
        src: "{{ dl }}/containerd.tar.gz"
        dest: /usr/local
        remote_src: true
      when: "'v' ~ v.CONTAINERD_VERSION not in (_ctd_cur.stdout | default(''))"
      notify: restart containerd

    - name: runc ที่ติดตั้งอยู่เป็นเวอร์ชันไหน
      ansible.builtin.command: runc --version
      register: _runc_cur
      changed_when: false
      failed_when: false
      check_mode: false

    - name: ติดตั้ง runc
      ansible.builtin.copy:
        src: "{{ dl }}/runc.amd64"
        dest: /usr/local/sbin/runc
        mode: "0755"
        remote_src: true
      when: v.RUNC_VERSION not in (_runc_cur.stdout | default(''))

    - name: สร้าง /opt/cni/bin
      ansible.builtin.file:
        path: /opt/cni/bin
        state: directory
        mode: "0755"

    # CNI plugin ไม่มีคำสั่งบอกเวอร์ชันที่เชื่อถือได้ จึงจดไว้เองเป็น stamp
    - name: อ่าน stamp เวอร์ชัน CNI ที่ติดตั้งไว้
      ansible.builtin.slurp:
        src: /opt/cni/bin/.cni-version
      register: _cni_stamp
      failed_when: false
      check_mode: false

    - name: แตก CNI plugins
      ansible.builtin.unarchive:
        src: "{{ dl }}/cni-plugins.tgz"
        dest: /opt/cni/bin
        remote_src: true
      when: (_cni_stamp.content | default('') | b64decode | trim) != v.CNI_PLUGINS_VERSION

    - name: จด stamp เวอร์ชัน CNI
      ansible.builtin.copy:
        dest: /opt/cni/bin/.cni-version
        content: "{{ v.CNI_PLUGINS_VERSION }}\n"
        mode: "0644"

    - name: สร้างที่วาง systemd unit
      ansible.builtin.file:
        path: /usr/local/lib/systemd/system
        state: directory
        mode: "0755"

    - name: ติดตั้ง containerd.service
      ansible.builtin.copy:
        src: "{{ dl }}/containerd.service"
        dest: /usr/local/lib/systemd/system/containerd.service
        mode: "0644"
        remote_src: true
      notify: daemon-reload

    - name: ทำ daemon-reload เดี๋ยวนี้ก่อนไปต่อ
      ansible.builtin.meta: flush_handlers

    # -------------------------------------------------------------------------
    #  3 · config.toml
    # -------------------------------------------------------------------------
    - name: สร้าง /etc/containerd
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: มี config.toml อยู่แล้วหรือยัง
      ansible.builtin.stat:
        path: /etc/containerd/config.toml
      register: _cfg

    # ตั้งใจไม่ regenerate ทับของเดิม — ถ้า upgrade containerd แล้วอยากได้ config
    # ชุดใหม่ ต้องลบไฟล์เองก่อนรัน แล้วเทียบ diff กับของเก่าด้วยตา
    - name: สร้าง config.toml จากค่า default
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: containerd config default > /etc/containerd/config.toml
      when: not _cfg.stat.exists
      changed_when: true
      notify: restart containerd

    - name: เปิด SystemdCgroup — ถ้าไม่ตรงกับ kubelet จะ evict pod มั่วตอนโหลดสูง
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: restart containerd

    - name: ต้องไม่เหลือ SystemdCgroup = false แม้แต่บรรทัดเดียว
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: grep -c 'SystemdCgroup = false' /etc/containerd/config.toml || true
      register: _sc
      changed_when: false
      failed_when: _sc.stdout | int > 0
      check_mode: false

    # -------------------------------------------------------------------------
    #  4 · private registry
    # -------------------------------------------------------------------------
    - name: สร้าง certs.d ของ registry
      ansible.builtin.file:
        path: "/etc/containerd/certs.d/{{ v.REGISTRY_HOST }}"
        state: directory
        mode: "0755"

    - name: วาง hosts.toml — HTTPS
      ansible.builtin.copy:
        dest: "/etc/containerd/certs.d/{{ v.REGISTRY_HOST }}/hosts.toml"
        mode: "0644"
        content: |
          server = "https://{{ v.REGISTRY_HOST }}"

          [host."https://{{ v.REGISTRY_HOST }}"]
            capabilities = ["pull", "resolve"]
      when: registry_scheme == 'https'
      notify: restart containerd

    - name: วาง hosts.toml — HTTP ล้วน
      ansible.builtin.copy:
        dest: "/etc/containerd/certs.d/{{ v.REGISTRY_HOST }}/hosts.toml"
        mode: "0644"
        content: |
          server = "http://{{ v.REGISTRY_HOST }}"

          [host."http://{{ v.REGISTRY_HOST }}"]
            capabilities = ["pull", "resolve"]
            skip_verify = true
      when: registry_scheme == 'http'
      notify: restart containerd

    - name: ติดตั้ง CA ของ registry (ถ้ามี)
      ansible.builtin.copy:
        src: "{{ registry_ca_file }}"
        dest: /etc/pki/ca-trust/source/anchors/myhr-registry-ca.crt
        mode: "0644"
      when: registry_ca_file | length > 0
      notify: update-ca-trust

    # -------------------------------------------------------------------------
    #  5 · เปิด containerd + ลง kubeadm/kubelet/kubectl
    # -------------------------------------------------------------------------
    - name: เปิด containerd
      ansible.builtin.systemd_service:
        name: containerd
        enabled: true
        state: started
        daemon_reload: true

    - name: เพิ่ม repo ของ Kubernetes — exclude กัน dnf update ยกเวอร์ชันเอง
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/kubernetes.repo
        mode: "0644"
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl=https://pkgs.k8s.io/core:/stable:/{{ v.K8S_REPO_MINOR }}/rpm/
          enabled=1
          gpgcheck=1
          gpgkey=https://pkgs.k8s.io/core:/stable:/{{ v.K8S_REPO_MINOR }}/rpm/repodata/repomd.xml.key
          exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni

    # cri-tools ต้องระบุเอง — kubeadm ประกาศว่าต้องการมัน แต่ exclude= ใน repo
    # กันไว้ ทำให้ dnf ลง kubeadm ได้โดยไม่ลาก cri-tools มาด้วย ผลคือไม่มี crictl
    # แล้วขั้นตรวจของบทนี้และบท 04/13 ใช้ไม่ได้ทั้งหมด
    - name: ลง kubelet / kubeadm / kubectl / cri-tools ตามเวอร์ชันที่ตรึงไว้
      ansible.builtin.dnf:
        name:
          - "kubelet-{{ v.K8S_VERSION }}"
          - "kubeadm-{{ v.K8S_VERSION }}"
          - "kubectl-{{ v.K8S_VERSION }}"
          - "cri-tools-{{ v.CRICTL_VERSION }}"
        state: present
        disable_excludes: kubernetes

    - name: enable kubelet แต่ยังไม่ start — จะ crash loop จนกว่าจะมี cluster
      ansible.builtin.systemd_service:
        name: kubelet
        enabled: true

    - name: ตรึงเวอร์ชัน kube* อีกชั้น
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          if dnf versionlock list 2>/dev/null | grep -q '^kubelet'; then
            echo NOOP
          else
            dnf versionlock add kubelet kubeadm kubectl cri-tools >/dev/null && echo LOCKED
          fi
      register: _kvlock
      # เทียบตรง ๆ ไม่ใช้ 'in' — กันบั๊ก substring แบบที่เคยเจอกับ unchanged/changed
      changed_when: "(_kvlock.stdout | default('') | trim) == 'LOCKED'"
      check_mode: false

    # -------------------------------------------------------------------------
    #  6 · crictl
    # -------------------------------------------------------------------------
    - name: ตั้ง crictl ให้รู้ว่า containerd อยู่ไหน
      ansible.builtin.copy:
        dest: /etc/crictl.yaml
        mode: "0644"
        content: |
          runtime-endpoint: unix:///run/containerd/containerd.sock
          image-endpoint: unix:///run/containerd/containerd.sock
          timeout: 10

    - name: restart containerd เดี๋ยวนี้ถ้ามีอะไรเปลี่ยน ก่อนไปตรวจผล
      ansible.builtin.meta: flush_handlers

    # -------------------------------------------------------------------------
    #  เกณฑ์ผ่านของบทนี้
    # -------------------------------------------------------------------------
    - name: เก็บผลตรวจ
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          echo "systemdcgroup=$(crictl info 2>/dev/null | jq -r '.config.containerd.runtimes.runc.options.SystemdCgroup')"
          echo "kubeadm=$(kubeadm version -o short 2>/dev/null)"
          echo "containerd_from_dnf=$(dnf list installed 2>/dev/null | grep -c '^containerd' || true)"
          echo "runtime=$(crictl version 2>/dev/null | awk -F': ' '/RuntimeVersion/{print $2}')"
          echo "cni_plugins=$(ls /opt/cni/bin 2>/dev/null | grep -cE '^(bridge|host-local|loopback|portmap)$')"
          echo "crictl=$(crictl --version 2>/dev/null | awk '{print $NF}')"
      register: _final
      changed_when: false
      # อ่านอย่างเดียว — ต้องรันแม้ใน --check ไม่งั้นตัวแปรที่ register หายทั้งชุด
      check_mode: false

    - name: ผลตรวจ
      ansible.builtin.debug:
        var: _final.stdout_lines

    - name: ต้องผ่านทุกข้อ
      ansible.builtin.assert:
        that:
          - "'systemdcgroup=true' in _final.stdout"
          - "'kubeadm=v' ~ v.K8S_VERSION in _final.stdout"
          - "'containerd_from_dnf=0' in _final.stdout"
          - "'runtime=v' ~ v.CONTAINERD_VERSION in _final.stdout"
          # loopback คือตัวที่ Cilium ต้องใช้จริง ขาดแล้ว pod ไม่มี lo
          - "'cni_plugins=4' in _final.stdout"
          # ไม่มี crictl แปลว่า cri-tools ไม่ได้ลง แล้วขั้นตรวจอื่นจะ false negative หมด
          - "'crictl=v' ~ v.CRICTL_VERSION in _final.stdout"
        fail_msg: >-
          ไม่ผ่านเกณฑ์บท 02 — ถ้า containerd_from_dnf ไม่ใช่ 0
          แปลว่า ol9_addons ยังเปิดอยู่ กลับไปดูบท 01 ข้อ 3

    # -------------------------------------------------------------------------
    #  sandbox image — คู่มือข้อ 3 ให้เทียบกับที่ kubeadm คาด
    # -------------------------------------------------------------------------
    #  ตั้งใจ "รายงาน" ไม่ใช่ "แก้ให้" เพราะยังไม่เคยเห็น config.toml ของ
    #  containerd 2.2.7 ตัวจริง — แก้ไฟล์นี้พลาดคือ runtime ตายทั้ง 6 เครื่อง
    #  พอเห็นค่าจริงรอบแรกแล้วค่อยตัดสินว่าจะให้ playbook แก้เองไหม
    # -------------------------------------------------------------------------
    - name: เทียบ sandbox image กับที่ kubeadm คาดไว้
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          want=$(kubeadm config images list --kubernetes-version "v{{ v.K8S_VERSION }}" 2>/dev/null | grep pause || true)
          # containerd 2.x เขียน TOML ด้วย single quote และมี key ชื่อ sandboxer อยู่ใกล้
          # ต้องมี ' = ' คั่นเพื่อไม่ให้ไปโดน sandboxer
          have=$(grep -oE "^[[:space:]]*sandbox = ['\"][^'\"]+['\"]" /etc/containerd/config.toml 2>/dev/null | grep -oE "['\"][^'\"]+['\"]" | tr -d "'\"" | head -1)
          echo "want=${want:-NOTFOUND}"
          echo "have=${have:-NOTFOUND}"
          if [ -n "$want" ] && [ "$want" = "$have" ]; then echo VERDICT=SAME; else echo VERDICT=DIFFERENT; fi
      register: _sandbox
      changed_when: false
      check_mode: false

    - name: ผล sandbox image
      ansible.builtin.debug:
        msg: "{{ _sandbox.stdout_lines }}"

    - name: เตือนถ้า sandbox image ไม่ตรง — ไม่หยุดงาน แต่ต้องเห็น
      ansible.builtin.debug:
        msg: >-
          ⚠️  sandbox image ไม่ตรงกับที่ kubeadm คาด — แก้ด้วย (ดูบท 02 ข้อ 5.1):
          cp /etc/containerd/config.toml /etc/containerd/config.toml.bak
          want=$(kubeadm config images list --kubernetes-version v{{ v.K8S_VERSION }} | grep pause)
          sed -i "s|^\([[:space:]]*sandbox = \).*|\1'${want}'|" /etc/containerd/config.toml
          systemctl restart containerd
      when: "'VERDICT=DIFFERENT' in _sandbox.stdout"

  handlers:
    - name: daemon-reload
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted

    - name: update-ca-trust
      ansible.builtin.command: update-ca-trust
