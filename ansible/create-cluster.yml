# =============================================================================
#  create-cluster.yml — แทนบทที่ 04
# =============================================================================
#  รัน:   ansible-playbook create-cluster.yml
#
#  ต้องผ่าน prepare-os.yml, container-runtime.yml และ **failover test ของบท 03**
#  มาก่อน — บท 03 ทำมือเท่านั้น เพราะต้องมีคนดูว่า VIP ย้ายจริง
#
#  🔴 playbook นี้ต่างจากสองตัวก่อนหน้า: มันสร้าง cluster ซึ่งเป็นงานครั้งเดียว
#     ไม่ใช่การ "ทำให้เครื่องตรงสเปก" จึงมีกันชนสองชั้น
#       · master01 : ข้าม kubeadm init ทั้งหมดถ้ามี /etc/kubernetes/admin.conf แล้ว
#       · node อื่น : ข้าม kubeadm join ถ้ามี /etc/kubernetes/kubelet.conf แล้ว
#     รันซ้ำจึงปลอดภัย ไม่รื้อ cluster ที่มีอยู่
#
#  ⚠️ master join ทีละตัว (serial: 1) เพราะ etcd ต้องการให้ member เข้าทีละราย
# =============================================================================
---
# =============================================================================
#  ขั้น 0 · ตรวจก่อนเริ่ม 4 ข้อ ตามคู่มือ
# =============================================================================
- name: ตรวจความพร้อมก่อนสร้าง cluster
  hosts: k8s_nodes
  gather_facts: true

  pre_tasks:
    - name: อ่าน versions.env
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          set -a && source "{{ versions_env }}" && set +a
          grep -oE '^[A-Z][A-Z0-9_]*=' "{{ versions_env }}" | tr -d '=' | sort -u \
            | while read -r k; do printf '%s: "%s"\n' "$k" "${!k}"; done
      delegate_to: localhost
      run_once: true
      become: false
      register: _ver_raw
      changed_when: false
      check_mode: false

    - name: แปลงเป็นตัวแปร v
      ansible.builtin.set_fact:
        v: "{{ _ver_raw.stdout | from_yaml }}"

  tasks:
    - name: containerd ต้องทำงานและ SystemdCgroup ต้องเป็น true
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          echo "containerd=$(systemctl is-active containerd)"
          echo "cgroup=$(crictl info 2>/dev/null | jq -r '.config.containerd.runtimes.runc.options.SystemdCgroup')"
          echo "kubeadm=$(kubeadm version -o short 2>/dev/null)"
      register: _pre
      changed_when: false
      check_mode: false

    - name: ทุก node ต้องพร้อมก่อน ไม่งั้นหยุด
      ansible.builtin.assert:
        that:
          - "'containerd=active' in _pre.stdout"
          - "'cgroup=true' in _pre.stdout"
          - "'kubeadm=v' ~ v.K8S_VERSION in _pre.stdout"
        fail_msg: "node นี้ยังไม่พร้อม — กลับไปดูบท 02\n{{ _pre.stdout }}"
        quiet: true

    - name: HAProxy ต้องฟังที่ VIP port แล้ว — master เท่านั้น
      ansible.builtin.wait_for:
        host: "{{ v.VIP }}"
        port: "{{ v.VIP_PORT }}"
        timeout: 10
      when: inventory_hostname in groups['masters']

# =============================================================================
#  ขั้น 1-3 · kubeadm init บน master01
# =============================================================================
- name: สร้าง control plane เครื่องแรก
  hosts: "{{ groups['masters'][0] }}"
  gather_facts: false
  vars:
    v: "{{ hostvars[groups['masters'][0]]['v'] }}"

  tasks:
    - name: cluster ถูกสร้างไปแล้วหรือยัง
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: _admin
      check_mode: false

    - name: บอกให้รู้ว่าข้าม init เพราะมี cluster อยู่แล้ว
      ansible.builtin.debug:
        msg: >-
          /etc/kubernetes/admin.conf มีอยู่แล้ว — ข้าม kubeadm init ทั้งหมด
          · ถ้าตั้งใจจะสร้างใหม่ ต้อง kubeadm reset ด้วยมือก่อน playbook ไม่ทำให้
      when: _admin.stat.exists

    - name: สร้างที่เก็บ audit log ตามที่ระบุใน kubeadm-config
      ansible.builtin.file:
        path: /var/log/kubernetes
        state: directory
        mode: "0700"

    - name: ส่ง kubeadm-config.yaml ขึ้นเครื่อง
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../config/kubeadm/kubeadm-config.yaml"
        dest: /root/k8s/config/kubeadm/kubeadm-config.yaml
        mode: "0600"

    - name: ดึง image ล่วงหน้า — แยกขั้นเพื่อให้แยกปัญหาได้
      ansible.builtin.command:
        cmd: kubeadm config images pull --kubernetes-version v{{ v.K8S_VERSION }}
      when: not _admin.stat.exists
      changed_when: true

    - name: preflight แบบ dry-run ก่อนของจริง
      ansible.builtin.command:
        cmd: >-
          kubeadm init phase preflight
          --config=/root/k8s/config/kubeadm/kubeadm-config.yaml --dry-run
      when: not _admin.stat.exists
      changed_when: false

    # -------------------------------------------------------------------------
    #  🔴 จุดที่ย้อนกลับไม่ได้
    # -------------------------------------------------------------------------
    #  --skip-phases=addon/kube-proxy ห้ามลืม ไม่งั้น kube-proxy จะไปชนกับ
    #  Cilium kube-proxy replacement ในบท 05
    # -------------------------------------------------------------------------
    - name: kubeadm init
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          kubeadm init \
            --config=/root/k8s/config/kubeadm/kubeadm-config.yaml \
            --upload-certs \
            --skip-phases=addon/kube-proxy \
            | tee /root/k8s/kubeadm-init.log
      when: not _admin.stat.exists
      changed_when: true

    - name: 🔒 kubeadm-init.log มี token และ certificate key — ปิดสิทธิ์ไว้
      ansible.builtin.file:
        path: /root/k8s/kubeadm-init.log
        mode: "0600"
      failed_when: false

    - name: ตั้ง kubeconfig ให้ root
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: "0700"

    - name: วาง admin.conf เป็น kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        mode: "0600"

    - name: cluster-info ต้องชี้ไปที่ VIP ไม่ใช่ IP ของ master01
      ansible.builtin.command: kubectl cluster-info
      register: _ci
      changed_when: false
      check_mode: false

    - name: ยืนยัน controlPlaneEndpoint
      ansible.builtin.assert:
        that:
          - v.VIP ~ ':' ~ v.VIP_PORT in _ci.stdout
        fail_msg: >-
          cluster-info ไม่ได้ชี้ไปที่ {{ v.VIP }}:{{ v.VIP_PORT }}
          → controlPlaneEndpoint ไม่ได้ผล ต้องรื้อ cluster ทำใหม่ (แก้ทีหลังไม่ได้)
        quiet: true

# =============================================================================
#  ขั้น 4-5 · ออกบัตรผ่านแล้วให้เครื่องที่เหลือ join
# =============================================================================
- name: ออก token และ certificate key จาก master01
  hosts: "{{ groups['masters'][0] }}"
  gather_facts: false

  tasks:
    # certificate-key หมดอายุ 2 ชม. · token หมดตาม ttl — ออกใหม่ทุกครั้งที่รัน
    # ถูกกว่าการไปงมหาใน kubeadm-init.log ว่าหมดอายุหรือยัง
    - name: ออก certificate key ชุดใหม่
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: kubeadm init phase upload-certs --upload-certs | tail -1
      register: _certkey
      changed_when: false
      check_mode: false
      no_log: true

    - name: ออกคำสั่ง join ชุดใหม่
      ansible.builtin.command: kubeadm token create --print-join-command
      register: _joincmd
      changed_when: false
      check_mode: false
      no_log: true

    - name: เก็บไว้ให้ play ถัดไปใช้
      ansible.builtin.set_fact:
        join_cmd: "{{ _joincmd.stdout | trim }}"
        cert_key: "{{ _certkey.stdout | trim }}"
      no_log: true

- name: Join master ที่เหลือ — ทีละเครื่อง
  hosts: masters:!{{ groups['masters'][0] }}
  gather_facts: false
  # 🔴 etcd ต้องการให้ member เข้าทีละราย ห้ามขนานเด็ดขาด
  serial: 1

  tasks:
    - name: เครื่องนี้ join ไปแล้วหรือยัง
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: _joined
      check_mode: false

    - name: join เข้า control plane
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          {{ hostvars[groups['masters'][0]]['join_cmd'] }}
          --control-plane
          --certificate-key {{ hostvars[groups['masters'][0]]['cert_key'] }}
          --cri-socket unix:///run/containerd/containerd.sock
      when: not _joined.stat.exists
      changed_when: true
      no_log: true

    - name: ตั้ง kubeconfig
      ansible.builtin.file:
        path: /root/.kube
        state: directory
        mode: "0700"

    - name: วาง admin.conf เป็น kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: true
        mode: "0600"

    - name: รอให้ etcd member ใหม่เข้าที่ก่อนไปเครื่องถัดไป
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: kubectl -n kube-system get pod etcd-{{ inventory_hostname }} -o jsonpath='{.status.phase}'
      register: _etcd
      until: _etcd.stdout == 'Running'
      retries: 30
      delay: 10
      changed_when: false
      check_mode: false

- name: Join worker — พร้อมกันได้
  hosts: workers
  gather_facts: false

  tasks:
    - name: เครื่องนี้ join ไปแล้วหรือยัง
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: _joined
      check_mode: false

    # ไม่มี --control-plane และไม่มี --certificate-key — สองอย่างนั้นของ master เท่านั้น
    - name: join เป็น worker
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          {{ hostvars[groups['masters'][0]]['join_cmd'] }}
          --cri-socket unix:///run/containerd/containerd.sock
      when: not _joined.stat.exists
      changed_when: true
      no_log: true

# =============================================================================
#  ขั้น 6 · เกณฑ์ผ่านของบทนี้
# =============================================================================
- name: ตรวจสถานะรวม
  hosts: "{{ groups['masters'][0] }}"
  gather_facts: false
  vars:
    v: "{{ hostvars[groups['masters'][0]]['v'] }}"

  tasks:
    - name: เก็บผลตรวจ
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          echo "nodes=$(kubectl get nodes --no-headers 2>/dev/null | wc -l)"
          echo "versions_ok=$(kubectl get nodes --no-headers -o custom-columns=V:.status.nodeInfo.kubeletVersion 2>/dev/null | sort -u | tr -d '\n')"
          echo "kubeproxy=$(kubectl -n kube-system get ds kube-proxy --no-headers 2>/dev/null | wc -l)"
          echo "etcd_pods=$(kubectl -n kube-system get pods -l component=etcd --no-headers 2>/dev/null | wc -l)"
      register: _sum
      changed_when: false
      check_mode: false

    - name: ผลตรวจ
      ansible.builtin.debug:
        var: _sum.stdout_lines

    - name: ต้องผ่านทุกข้อ
      ansible.builtin.assert:
        that:
          - "'nodes=' ~ (groups['k8s_nodes'] | length) in _sum.stdout"
          - "'versions_ok=v' ~ v.K8S_VERSION in _sum.stdout"
          - "'kubeproxy=0' in _sum.stdout"
          - "'etcd_pods=' ~ (groups['masters'] | length) in _sum.stdout"
        fail_msg: >-
          ไม่ผ่านเกณฑ์บท 04
          · kubeproxy ต้องเป็น 0 — ถ้าไม่ใช่แปลว่าลืม --skip-phases=addon/kube-proxy
            ลบด้วย kubectl -n kube-system delete ds kube-proxy && delete cm kube-proxy
          · node ทุกตัวต้องเป็น NotReady ในขั้นนี้ ซึ่งถูกต้องแล้ว (ยังไม่มี CNI)

    - name: อายุ certificate — จดลงปฏิทินทีมทันที
      ansible.builtin.command: kubeadm certs check-expiration
      register: _certs
      changed_when: false
      check_mode: false

    - name: วันหมดอายุ certificate
      ansible.builtin.debug:
        msg: "{{ _certs.stdout_lines | select('search', 'CERTIFICATE|apiserver|ca ') | list }}"
