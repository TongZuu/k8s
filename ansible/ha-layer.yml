# =============================================================================
#  ha-layer.yml — แทนข้อ 1-3 ของบทที่ 03 (keepalived + HAProxy)
# =============================================================================
#  รัน:   ansible-playbook ha-layer.yml --check --diff --limit k8s-master01
#         ansible-playbook ha-layer.yml --limit k8s-master03
#         ansible-playbook ha-layer.yml            # ทั้ง 3 master
#
#  ต้องผ่าน prepare-os.yml มาก่อน (ต้องมี 8443/tcp และ protocol vrrp ใน firewalld)
#
#  ⚠️ playbook นี้ทำแค่ "วาง config ให้ถูก" — ไม่ได้พิสูจน์ว่า HA ทำงาน
#     ข้อ 5 ของบทที่ 03 (failover test) ยัง **ต้องทำมือ** และห้ามข้าม
#     ต้องมีคนเห็นว่า VIP ย้ายเครื่องจริงตอนดึงปลั๊ก ไม่ใช่แค่ service ขึ้นเขียว
#
#  ⚠️ auth_pass ถามตอนรัน ไม่เก็บลงไฟล์ ไม่ผ่าน shell history
#     รันครั้งเดียวให้ครบ 3 เครื่องพร้อมกัน — รหัสจะได้ตรงกันแน่นอน
#     ถ้ารันทีละเครื่องแล้วพิมพ์ไม่เหมือนกัน จะกลายเป็น split brain
#
#  ⚠️ --check บนเครื่องเปล่าจะล้มที่ task ที่พึ่งผลของ task ก่อนหน้า
#     (validate ของ haproxy.cfg ต้องมี /etc/haproxy อยู่จริงก่อน)
#     เครื่องเปล่าให้รันจริงไปเลย — เหมือน container-runtime.yml
# =============================================================================
---
- name: HA layer — keepalived + HAProxy
  hosts: masters
  gather_facts: true

  vars_prompt:
    - name: vrrp_auth_pass
      prompt: |
        VRRP auth_pass — 1-8 ตัวอักษร ต้องเหมือนกันทั้ง 3 master
        (keepalived ตัดตัวที่เกิน 8 ทิ้งเงียบ ๆ)
      private: true
      confirm: true

  vars:
    #  ค่าที่ต่างกันรายเครื่อง — เดิมแยกเป็นไฟล์ config คนละใบ
    #  priority ห่างกัน 20 เพราะ check script หักได้ 20 (weight -20)
    #  เครื่องที่ script ล้มจึงตกไปต่ำกว่าเครื่องถัดไปทันที
    keepalived_nodes:
      k8s-master01: { state: MASTER, priority: 110 }
      k8s-master02: { state: BACKUP, priority: 100 }
      k8s-master03: { state: BACKUP, priority: 90 }

    #  วง IP ที่ใช้หา interface จริงของแต่ละเครื่อง
    node_subnet_re: '^192\.168\.50\.'

    repo_config: "{{ playbook_dir }}/../config"

  # ---------------------------------------------------------------------------
  #  ตรวจ input ก่อนแตะเครื่องปลายทาง
  # ---------------------------------------------------------------------------
  pre_tasks:
    - name: รหัส VRRP ต้องไม่ว่างและไม่เกิน 8 ตัวอักษร
      ansible.builtin.assert:
        that:
          - vrrp_auth_pass | length > 0
          - vrrp_auth_pass | length <= 8
        fail_msg: >-
          auth_pass ต้องยาว 1-8 ตัวอักษร (ได้มา {{ vrrp_auth_pass | length }} ตัว)
          ถ้ายาวเกิน keepalived จะตัดทิ้งเงียบ ๆ แล้วแต่ละเครื่องอาจได้ไม่ตรงกัน
      run_once: true

    - name: เครื่องนี้ต้องอยู่ในตาราง keepalived_nodes
      ansible.builtin.assert:
        that:
          - inventory_hostname in keepalived_nodes
        fail_msg: >-
          ไม่มี state/priority ของ {{ inventory_hostname }} ใน keepalived_nodes
          — ถ้าเพิ่ม master ต้องเพิ่มที่นี่ด้วย และ priority ห้ามซ้ำกับเครื่องอื่น

    # -------------------------------------------------------------------------
    #  โหลด versions.env — รูปแบบเดียวกับ playbook ตัวอื่น
    #  ต้องอยู่ใน play เดียวกับ node ไม่ใช่แยก play ที่ hosts: localhost
    #  เพราะ --limit จะตัด play ของ localhost ทิ้งไปด้วย
    # -------------------------------------------------------------------------
    - name: อ่าน versions.env ด้วย bash — ใช้ semantics เดียวกับคู่มือ
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          set -a && source "{{ versions_env }}" && set +a
          grep -oE '^[A-Z][A-Z0-9_]*=' "{{ versions_env }}" | tr -d '=' | sort -u \
            | while read -r k; do printf '%s: "%s"\n' "$k" "${!k}"; done
      delegate_to: localhost
      run_once: true
      become: false
      register: _ver_raw
      changed_when: false
      # อ่านอย่างเดียว — ต้องรันแม้ใน --check ไม่งั้นตัวแปรหายทั้งชุด
      check_mode: false

    - name: แปลงเป็นตัวแปร v
      ansible.builtin.set_fact:
        v: "{{ _ver_raw.stdout | from_yaml }}"

  tasks:
    # -------------------------------------------------------------------------
    #  1 · ติดตั้ง
    # -------------------------------------------------------------------------
    - name: ติดตั้ง keepalived และ haproxy จาก repo ของ OS
      ansible.builtin.dnf:
        name:
          - keepalived
          - haproxy
        state: present

    # -------------------------------------------------------------------------
    #  2 · หาชื่อ interface จริงของเครื่องนี้
    # -------------------------------------------------------------------------
    #  ห้าม hardcode ens192 — ชื่อ NIC ต่างกันได้รายเครื่อง ขึ้นกับ virtual
    #  hardware ที่ VM ถูกสร้างมา (เคยเจอ master01=ens192 แต่ master02=ens33)
    #  ถ้าชื่อผิด keepalived จะตายด้วย "permanent error CONFIG" ตั้งแต่ parse
    # -------------------------------------------------------------------------
    - name: หา interface ที่ถือ IP ในวง 192.168.50.0/24
      ansible.builtin.set_fact:
        node_iface: "{{ item }}"
      loop: "{{ ansible_facts.interfaces }}"
      when:
        - ansible_facts[item].ipv4 is defined
        - ansible_facts[item].ipv4.address is match(node_subnet_re)

    - name: ต้องหา interface เจอ ไม่งั้นหยุด
      ansible.builtin.assert:
        that:
          - node_iface is defined
          - node_iface | length > 0
        fail_msg: >-
          หา interface ที่ถือ IP 192.168.50.x บน {{ inventory_hostname }} ไม่เจอ
          — ตรวจด้วย `ip -br -4 addr show` บนเครื่องนั้น
        success_msg: "interface ของเครื่องนี้: {{ node_iface | default('') }}"

    # -------------------------------------------------------------------------
    #  3 · HAProxy — ไฟล์เดียวกันทั้ง 3 เครื่อง
    # -------------------------------------------------------------------------
    - name: วาง haproxy.cfg
      ansible.builtin.copy:
        src: "{{ repo_config }}/haproxy/haproxy.cfg"
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: "0644"
        backup: true
        # ไม่ผ่าน syntax check = ไม่เขียนไฟล์ ของเดิมไม่โดนแตะ
        validate: haproxy -c -f %s
      notify: restart haproxy

    # -------------------------------------------------------------------------
    #  4 · keepalived
    # -------------------------------------------------------------------------
    - name: วาง check_apiserver.sh
      ansible.builtin.copy:
        src: "{{ repo_config }}/keepalived/check_apiserver.sh"
        dest: /etc/keepalived/check_apiserver.sh
        owner: root
        group: root
        # 0700 + owner root จำเป็นเพราะ config เปิด enable_script_security
        mode: "0700"
      notify: restart keepalived

    - name: วาง keepalived.conf จาก template
      ansible.builtin.template:
        src: keepalived.conf.j2
        dest: /etc/keepalived/keepalived.conf
        owner: root
        group: root
        mode: "0600"
        backup: true
      notify: restart keepalived

    # -------------------------------------------------------------------------
    #  5 · เปิด service
    # -------------------------------------------------------------------------
    #  enabled + started เป็น idempotent — ต่างจาก `systemctl enable --now`
    #  ที่ไม่ reload config ถ้า service รันอยู่แล้ว การ restart จริงมาจาก
    #  handler ซึ่งจะทำงานเฉพาะตอนไฟล์เปลี่ยนเท่านั้น
    # -------------------------------------------------------------------------
    - name: เปิด haproxy
      ansible.builtin.systemd_service:
        name: haproxy
        enabled: true
        state: started

    - name: HAProxy ต้องฟังที่ 8443 ก่อนจะเปิด keepalived
      ansible.builtin.wait_for:
        port: "{{ v.VIP_PORT | int }}"
        host: 127.0.0.1
        timeout: 30
      # check mode ยังไม่มีของจริงให้รอ
      when: not ansible_check_mode

    - name: เปิด keepalived
      ansible.builtin.systemd_service:
        name: keepalived
        enabled: true
        state: started

  # ---------------------------------------------------------------------------
  #  ตรวจผลจริง ไม่ใช่เชื่อว่า task ผ่านแล้วจบ
  # ---------------------------------------------------------------------------
  post_tasks:
    - name: รอ handler ทำงานให้จบก่อนตรวจ
      ansible.builtin.meta: flush_handlers

    # -------------------------------------------------------------------------
    #  รอ VRRP เลือกตั้งให้จบก่อนจะไปตรวจอะไรที่เกี่ยวกับ VIP
    # -------------------------------------------------------------------------
    #  handler restart keepalived ทั้ง 3 เครื่องเกือบพร้อมกัน ระหว่างนั้น VIP จะ
    #  หลุด/ย้าย/ซ้อนกันชั่วคราวเป็นเรื่องปกติ ถ้าเก็บค่าทันทีจะได้ภาพกลางอากาศ
    #  แล้ว assert ตกทั้งที่ระบบไม่ได้พัง
    #
    #  เงื่อนไขเช็กเป็นราย host ได้ เพราะรู้อยู่แล้วว่าเครื่องไหนควรถือ VIP:
    #  ตัวที่ priority สูงสุด (state MASTER) ต้องถือ · ที่เหลือต้องไม่ถือ
    #  ถ้าครบ 30 วินาทีแล้วยังไม่เข้าที่ = มีปัญหาจริง ไม่ใช่แค่ยังไม่นิ่ง
    # -------------------------------------------------------------------------
    - name: รอจน VIP เข้าที่ตามลำดับ priority
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: "ip -4 addr show | grep -c '{{ v.VIP }}/' || true"
      register: _vip_wait
      changed_when: false
      check_mode: false
      retries: 10
      delay: 3
      until: >-
        (_vip_wait.stdout | trim) ==
        (keepalived_nodes[inventory_hostname].state == 'MASTER') | ternary('1', '0')
      when: not ansible_check_mode

    - name: เก็บสถานะจริงจากเครื่อง
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          echo "haproxy=$(systemctl is-active haproxy)"
          echo "keepalived=$(systemctl is-active keepalived)"
          echo "bind8443=$(ss -lnt | grep -c ':{{ v.VIP_PORT }} ')"
          echo "iface={{ node_iface }}"
          echo "vip=$(ip -4 addr show | grep -c '{{ v.VIP }}/')"
          echo "checkscript=$(/etc/keepalived/check_apiserver.sh >/dev/null 2>&1; echo $?)"
      register: _post
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: ผลลัพธ์ต่อเครื่อง
      ansible.builtin.debug:
        var: _post.stdout_lines
      when: not ansible_check_mode

    - name: ทุกข้อต้องผ่าน ไม่งั้นห้ามไปข้อ 5
      ansible.builtin.assert:
        that:
          - "'haproxy=active' in _post.stdout"
          - "'keepalived=active' in _post.stdout"
          - "'bind8443=1' in _post.stdout"
          - "'checkscript=0' in _post.stdout"
        fail_msg: >-
          {{ inventory_hostname }} ยังไม่ผ่าน — ดู `journalctl -xeu keepalived -n 40`
          สาเหตุที่เจอบ่อย: ชื่อ interface ไม่ตรง · auth_pass ว่าง · HAProxy ไม่ได้ฟัง 8443
      when: not ansible_check_mode

    - name: VIP ต้องขึ้นที่เครื่องเดียวเท่านั้น
      vars:
        _vip_holders: >-
          {{ ansible_play_hosts
             | map('extract', hostvars)
             | selectattr('_post', 'defined')
             | map(attribute='_post.stdout')
             | select('search', 'vip=1')
             | list }}
      ansible.builtin.assert:
        that:
          - _vip_holders | length == 1
        fail_msg: >-
          {% if _vip_holders | length == 0 %}
          ไม่มีเครื่องไหนถือ VIP เลย — keepalived อาจยังไม่ขึ้น หรือ config ผิด
          ดู `journalctl -xeu keepalived -n 40` บนทุกเครื่อง
          {% else %}
          VIP ขึ้นพร้อมกัน {{ _vip_holders | length }} เครื่อง
          ถ้าค้างแบบนี้ = split brain → ตรวจ auth_pass ให้ตรงกันทั้ง 3 เครื่อง
          และ `firewall-cmd --list-protocols` ต้องมี vrrp
          ถ้าสลับไปมา = VIP กระพริบ → ตรวจว่า check_apiserver.sh มีด่าน ':6443 ' หรือยัง
          — ดูข้อ 4 ของบทที่ 03 และหัวข้อ 1.2b ของบทที่ 13
          {% endif %}
      run_once: true
      when:
        - not ansible_check_mode
        - groups['masters'] | length == ansible_play_hosts | length

    - name: ยังไม่จบ — ข้อ 5 ต้องทำมือ
      ansible.builtin.debug:
        msg: >-
          config วางครบแล้ว แต่ยังไม่ได้พิสูจน์ว่า HA ทำงาน
          ไปทำ "ข้อ 5 · ทดสอบ failover" ในบทที่ 03 ต่อ — ห้ามข้ามไปบท 04 ก่อน
      run_once: true

  handlers:
    - name: restart haproxy
      ansible.builtin.systemd_service:
        name: haproxy
        state: restarted

    - name: restart keepalived
      ansible.builtin.systemd_service:
        name: keepalived
        state: restarted
