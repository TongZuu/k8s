[masters]
k8s-master01 ansible_host=192.168.50.101
k8s-master02 ansible_host=192.168.50.102
k8s-master03 ansible_host=192.168.50.103

[workers]
k8s-worker01 ansible_host=192.168.50.104
k8s-worker02 ansible_host=192.168.50.105
k8s-worker03 ansible_host=192.168.50.106

[k8s_nodes:children]
masters
workers

[k8s_nodes:vars]
ansible_user=root
