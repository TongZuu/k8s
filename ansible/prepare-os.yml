# =============================================================================
#  prepare-os.yml — แทนบทที่ 01
# =============================================================================
#  รัน:   ansible-playbook prepare-os.yml --check     ← ดูอย่างเดียว ไม่แก้อะไร
#         ansible-playbook prepare-os.yml
#
#  ⚠️ playbook นี้ "ไม่ได้" ทำสองข้อของบท 01 โดยเจตนา:
#     · ข้อ 2 สลับ/ตรึง kernel  → ควรอยู่ใน VM template ไม่ใช่ที่นี่
#     · ข้อ 5 ย้าย partition    → umount + แก้ fstab พลาดแล้วเครื่องบูตไม่ขึ้น
#                                 ต้องแบ่ง partition ให้ถูกตั้งแต่สร้าง template
#     ทั้งสองข้อมี task ตรวจให้ว่าทำมาแล้วหรือยัง ถ้ายังจะหยุดทันที
# =============================================================================
---
- name: เตรียม OS ทุกเครื่อง
  hosts: k8s_nodes
  gather_facts: true
  # ---------------------------------------------------------------------------
  #  โหลด versions.env ก่อนทุกอย่าง
  # ---------------------------------------------------------------------------
  #  ต้องอยู่ใน play เดียวกับ node ไม่ใช่แยก play ที่ hosts: localhost
  #  เพราะ --limit จะตัด play ของ localhost ทิ้งไปด้วย แล้ว v จะไม่มีอยู่จริง
  # ---------------------------------------------------------------------------
  pre_tasks:
    - name: อ่าน versions.env ด้วย bash — ใช้ semantics เดียวกับคู่มือ
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          set -a && source "{{ versions_env }}" && set +a
          grep -oE '^[A-Z][A-Z0-9_]*=' "{{ versions_env }}" | tr -d '=' | sort -u \
            | while read -r k; do printf '%s: "%s"\n' "$k" "${!k}"; done
      delegate_to: localhost
      run_once: true
      become: false
      register: _ver_raw
      changed_when: false
      # อ่านอย่างเดียว — ต้องรันแม้ใน --check ไม่งั้นตัวแปรหายทั้งชุด
      check_mode: false

    - name: แปลงเป็นตัวแปร v
      ansible.builtin.set_fact:
        v: "{{ _ver_raw.stdout | from_yaml }}"

    - name: แสดงค่าที่โหลดได้
      ansible.builtin.debug:
        msg: "K8S={{ v.K8S_VERSION }} VIP={{ v.VIP }} IFACE={{ v.NODE_IFACE }}"
      run_once: true

  tasks:
    # -------------------------------------------------------------------------
    #  ตรวจสิ่งที่ต้องมาจาก VM template ก่อน — ถ้าไม่ผ่านหยุดทันที
    # -------------------------------------------------------------------------
    # -------------------------------------------------------------------------
    #  เส้นที่บังคับคือ major.minor + ต้องเป็น UEK — สองอย่างนี้เปลี่ยน feature set
    #  ที่ Cilium/eBPF ใช้จริง ส่วนหางเลข (203/204/205) เป็น errata ของ Oracle
    #  ซึ่งไม่กระทบ แต่ก็ไม่ควรต่างกันเงียบ ๆ จึงเตือนไว้ในงานถัดไป
    # -------------------------------------------------------------------------
    - name: kernel ต้องเป็น UEK และตรง major.minor กับ versions.env
      ansible.builtin.assert:
        that:
          - "'uek' in ansible_facts['kernel']"
          - ansible_facts['kernel'].startswith(v.KERNEL_UEK.split('-')[0] ~ '-')
        fail_msg: >-
          kernel บนเครื่องนี้คือ {{ ansible_facts['kernel'] }}
          แต่ versions.env ระบุสาย {{ v.KERNEL_UEK.split('-')[0] }} และต้องเป็น uek
          → คนละสายแปลว่า feature set ต่างกันจริง (เช่นหลุดไป RHCK)
             แก้ที่ VM template ก่อน อย่าให้ playbook สลับ kernel ให้
        success_msg: "kernel {{ ansible_facts['kernel'] }} อยู่ในสายที่ถูกต้อง"

    - name: เตือนถ้า patch level ไม่ตรงกัน — ไม่หยุดงาน แต่ต้องเห็น
      ansible.builtin.debug:
        msg: >-
          ⚠️  kernel ของเครื่องนี้ ({{ ansible_facts['kernel'] }})
          ไม่ตรงกับ KERNEL_UEK ใน versions.env ({{ v.KERNEL_UEK }})
          · ไม่กระทบ Cilium เพราะ major.minor เดียวกัน
          · แต่เวลามีอาการแปลกเฉพาะ node นี้ ต้องเสียเวลาตัดตัวแปรนี้ทิ้งก่อนทุกครั้ง
          · ค้างไว้เป็นหนี้ใน docs/CHECKLIST.md — ทำให้ตรงตอนยังไม่มี workload ถูกที่สุด
      when: not ansible_facts['kernel'].startswith(v.KERNEL_UEK)

    - name: kernel ต้องถูก versionlock ไว้แล้ว
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: dnf versionlock list 2>/dev/null | grep -c kernel-uek || true
      register: _vlock
      changed_when: false
      failed_when: _vlock.stdout | int == 0

    - name: partition ต้องถูกย้ายมาแล้วตั้งแต่สร้าง VM
      vars:
        _want: "{{ '/var/lib/etcd' if inventory_hostname in groups['masters'] else '/var/lib/containerd' }}"
      ansible.builtin.assert:
        that:
          - _want in (ansible_facts['mounts'] | map(attribute='mount') | list)
        fail_msg: >-
          ยังไม่มี partition แยกสำหรับ {{ _want }}
          → ทำใน VM template หรือทำมือตามบท 01 ข้อ 5 · playbook ไม่แตะ fstab ให้

    # -------------------------------------------------------------------------
    #  1 · hostname และ /etc/hosts
    # -------------------------------------------------------------------------
    - name: ตั้ง hostname ตามชื่อใน inventory
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    # เครื่องที่เคยรันคู่มือรุ่นก่อนมี marker จะมีบรรทัดค้างอยู่นอกบล็อก
    # ถ้าไม่ลบก่อน blockinfile จะเติมบล็อกใหม่ทับ กลายเป็นสองชุด
    - name: ลบบรรทัด /etc/hosts ที่ทำมือไว้นอกบล็อก
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          before=$(md5sum /etc/hosts | cut -d' ' -f1)
          sed -i -E '/^# BEGIN k8s cluster$/,/^# END k8s cluster$/!{/^[0-9.]+[[:space:]]+(k8s-(vip|master[0-9]+|worker[0-9]+)|\S+\.myhr\.co\.th)[[:space:]]*$/d}' /etc/hosts
          after=$(md5sum /etc/hosts | cut -d' ' -f1)
          # ห้ามใช้คำที่เป็น substring ของกันและกัน — "unchanged" มี "changed" อยู่ข้างใน
          if [ "$before" = "$after" ]; then echo NOOP; else echo REMOVED; fi
      register: _hosts_clean
      changed_when: "'REMOVED' in _hosts_clean.stdout"

    - name: วาง /etc/hosts — บล็อกเดียวกันทุกเครื่อง
      ansible.builtin.blockinfile:
        path: /etc/hosts
        # marker ต้องตรงกับที่บท 01 เขียนเป๊ะ — ทำมือแล้วรัน playbook ทับจะได้ changed=0
        marker: "# {mark} k8s cluster"
        # ไล่จากคีย์ใน versions.env ไม่ไล่พิมพ์ชื่อเครื่องเอง
        # เพิ่มเครื่องใหม่ = แก้ versions.env ที่เดียว ทุกเครื่องได้ /etc/hosts ใหม่ตอนรันรอบถัดไป
        block: |
          {{ v.VIP }}  {{ v.VIP_HOSTNAME }}
          {% for k in v.keys() | select('match', '^(MASTER|WORKER)[0-9]+_IP$') | sort %}
          {{ v[k] }}  {{ v[k | replace('_IP', '_NAME')] }}
          {% endfor %}
          {{ v.REGISTRY_IP }}  {{ v.REGISTRY_HOST }}

    # -------------------------------------------------------------------------
    #  2 · resolver option
    # -------------------------------------------------------------------------
    #  glibc ยิง A กับ AAAA พร้อมกันบน socket เดียว firewall ระหว่างทางทิ้งคำตอบ
    #  ตัวที่สองบางครั้ง resolver จึงรอครบ timeout 5 วินาทีทุกครั้งที่เจอชื่อใหม่
    #
    #  วัดจริงบน master01: helm show chart ของ Envoy Gateway
    #      ก่อนแก้ 26.9s  ->  หลังแก้ 4.1s
    #
    #  ต้องอยู่ใน playbook ไม่ใช่ทำมือ เพราะ NetworkManager เขียน /etc/resolv.conf
    #  ทับคืนทุกครั้งที่ restart network และเครื่องที่ติดตั้งใหม่ก็ได้ค่าเดิมกลับมา
    #
    #  ตั้งเฉพาะ dns-options ไม่แตะ ipv4.dns — nameserver เป็นเรื่องที่ต้องเคาะกับ
    #  ทีม network ก่อน (ดูหมายเหตุท้ายบท 01 ข้อ 1.1) ถ้าไปตั้งเองจะทับของที่เขาวางไว้
    - name: ตั้ง resolver option ผ่าน NetworkManager — ไม่งั้นทุกการแปลงชื่อใหม่ช้า 5 วินาที
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          want='single-request-reopen,timeout:2,attempts:2'
          conn=$(nmcli -g GENERAL.CONNECTION device show '{{ v.NODE_IFACE }}' 2>/dev/null | head -1)
          if [ -z "$conn" ]; then
            echo "NOCONN ไม่พบ connection ของ {{ v.NODE_IFACE }} — ตรวจ NODE_IFACE ใน versions.env" >&2
            exit 1
          fi
          # nmcli คืนค่าเป็น a,b,c ส่วนที่เก็บอาจเรียงต่างกัน จึงเทียบแบบ sort แล้วค่อยตัดสิน
          got=$(nmcli -g ipv4.dns-options connection show "$conn" 2>/dev/null | tr ',' '\n' | sed '/^$/d' | sort | paste -sd, -)
          exp=$(echo "$want" | tr ',' '\n' | sort | paste -sd, -)
          if [ "$got" = "$exp" ]; then echo NOOP; exit 0; fi
          nmcli connection modify "$conn" ipv4.dns-options "$want" || exit 1
          nmcli connection up "$conn" >/dev/null || exit 1
          echo APPLIED
      register: _dns_opts
      changed_when: "'APPLIED' in _dns_opts.stdout"

    # ตรวจผลจากไฟล์จริง ไม่ใช่เชื่อว่า nmcli ทำสำเร็จ — NM อาจเขียนไม่ทันถ้า
    # connection up คืนค่าก่อนที่ resolv.conf จะถูกเขียนใหม่
    - name: resolv.conf ต้องมีบรรทัด options จริง
      ansible.builtin.command: grep -q '^options.*single-request' /etc/resolv.conf
      changed_when: false

    #  เครื่องได้ IPv6 address มาแต่ไม่มี route ออกข้างนอก ซึ่งแย่กว่าไม่มี IPv6 เลย
    #  โปรแกรมเห็นว่าตัวเองใช้ IPv6 ได้ก็เลือกใช้ แล้วตายกลางทาง:
    #      dial tcp [2600:1f18:...]:443: connect: network is unreachable
    #
    #  curl ปิดบังปัญหานี้เพราะมี fallback ในตัว แต่เครื่องมือที่เขียนด้วย Go
    #  (helm, containerd) ไม่ได้ถอยให้ทุกกรณี ผลคือ curl บอกว่าเน็ตปกติ
    #  แต่ helm install ตาย — เจอจริงตอนลง Envoy Gateway ที่บท 07
    #
    #  ปลอดภัยกับ Cilium: cluster นี้เป็น IPv4 ล้วนและ cilium/values.yaml ไม่ได้เปิด ipv6
    - name: ปิด IPv6 ที่ interface — มี address แต่ไม่มี route ทำให้ helm/containerd ตาย
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          conn=$(nmcli -g GENERAL.CONNECTION device show '{{ v.NODE_IFACE }}' 2>/dev/null | head -1)
          if [ -z "$conn" ]; then
            echo "NOCONN ไม่พบ connection ของ {{ v.NODE_IFACE }} — ตรวจ NODE_IFACE ใน versions.env" >&2
            exit 1
          fi
          if [ "$(nmcli -g ipv6.method connection show "$conn" 2>/dev/null)" = "disabled" ]; then
            echo NOOP; exit 0
          fi
          nmcli connection modify "$conn" ipv6.method disabled || exit 1
          nmcli connection up "$conn" >/dev/null || exit 1
          echo APPLIED
      register: _ipv6_off
      changed_when: "'APPLIED' in _ipv6_off.stdout"

    # ยืนยันจาก interface จริง ไม่ใช่จาก config ของ NetworkManager
    - name: ต้องไม่เหลือ IPv6 address บน interface
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -uo pipefail
          n=$(ip -6 addr show '{{ v.NODE_IFACE }}' 2>/dev/null | grep -c inet6)
          echo "$n"
          [ "$n" -eq 0 ]
      changed_when: false

    # -------------------------------------------------------------------------
    #  3 · repo
    # -------------------------------------------------------------------------
    # ใช้ module แทน command เพราะ command รายงาน changed ทุกครั้ง
    # ทำให้ changed=0 เป็นไปไม่ได้ ซึ่งทำลายสัญญาณที่เราใช้ตรวจว่าเครื่องตรงสเปกแล้ว
    - name: ปิด ol9_addons — มี containerd ของ Oracle ที่จะไปทับ tarball ในบท 02
      community.general.dnf_config_manager:
        name: ol9_addons
        state: disabled
      # บางเครื่องอาจไม่มี repo นี้ตั้งแต่แรก ซึ่งก็คือสถานะที่ต้องการอยู่แล้ว
      failed_when: false

    - name: เปิดเฉพาะ repo ที่ใช้
      community.general.dnf_config_manager:
        name:
          - ol9_baseos_latest
          - ol9_appstream
          - ol9_UEKR8
        state: enabled

    - name: ปิด Ksplice — ใช้ OL แบบฟรีจึงไม่มีสิทธิ์ ปล่อยไว้ได้แต่ log error
      ansible.builtin.systemd_service:
        name: ksplice-uptrack.service
        enabled: false
        state: stopped
      failed_when: false

    # -------------------------------------------------------------------------
    #  4 · package พื้นฐาน + เวลา
    # -------------------------------------------------------------------------
    - name: ลง package พื้นฐาน
      ansible.builtin.dnf:
        name:
          - chrony
          - open-vm-tools
          - tar
          - curl
          - wget
          - iproute-tc
          - socat
          - conntrack-tools
          - ethtool
          - bash-completion
          - jq
        state: present

    - name: เปิด chronyd
      ansible.builtin.systemd_service:
        name: chronyd
        enabled: true
        state: started

    - name: เวลาต้อง sync แล้ว — TLS cert และ etcd raft พังทันทีถ้าเวลาเพี้ยน
      ansible.builtin.command: chronyc tracking
      register: _chrony
      changed_when: false
      failed_when: "'Leap status' not in _chrony.stdout or 'Normal' not in _chrony.stdout"

    # -------------------------------------------------------------------------
    #  6 · kernel module และ sysctl
    # -------------------------------------------------------------------------
    - name: ให้ module โหลดเองหลัง reboot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        mode: "0644"
        content: |
          overlay
          br_netfilter

    - name: โหลด module เดี๋ยวนี้ — ต้องมาก่อนตั้ง sysctl ไม่งั้น net.bridge.* set ไม่ติด
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: ตั้ง sysctl
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_file: /etc/sysctl.d/99-kubernetes.conf
        sysctl_set: true
        reload: true
      loop:
        - net.ipv4.ip_forward
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables

    # -------------------------------------------------------------------------
    #  7 · swap และ SELinux
    # -------------------------------------------------------------------------
    - name: ปิด swap เดี๋ยวนี้
      ansible.builtin.command: swapoff -a
      when: ansible_facts['swaptotal_mb'] | int > 0
      changed_when: true

    - name: คอมเมนต์บรรทัด swap ใน fstab ไม่ให้กลับมาหลัง reboot
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: ตั้ง SELinux เป็น permissive
      ansible.posix.selinux:
        policy: targeted
        state: permissive

    # -------------------------------------------------------------------------
    #  8 · firewalld
    # -------------------------------------------------------------------------
    - name: เปิดพอร์ตของ master
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - 6443/tcp          # kube-apiserver
        - 8443/tcp          # HAProxy frontend (VIP)
        - 2379-2380/tcp     # etcd client + peer
        - 2381/tcp          # etcd metrics — Prometheus scrape (บท 09)
        - 10250/tcp         # kubelet API
        - 10257/tcp         # controller-manager
        - 10259/tcp         # scheduler
        - 9100/tcp          # node-exporter (บท 09)
        - 8472/udp          # Cilium VXLAN
        - 4240/tcp          # Cilium health
        - 4244-4245/tcp     # Hubble
      when: inventory_hostname in groups['masters']

    - name: เปิด VRRP ให้ keepalived — master เท่านั้น
      ansible.posix.firewalld:
        rich_rule: rule protocol value="vrrp" accept
        permanent: true
        immediate: true
        state: enabled
      when: inventory_hostname in groups['masters']

    - name: เปิดพอร์ตของ worker
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - 10250/tcp         # kubelet API
        - 30000-32767/tcp   # NodePort range
        - 9100/tcp          # node-exporter (บท 09)
        - 8472/udp          # Cilium VXLAN
        - 4240/tcp          # Cilium health
        - 4244-4245/tcp     # Hubble
      when: inventory_hostname in groups['workers']

# =============================================================================
#  reboot + ตรวจซ้ำ — ข้ามได้ด้วย --skip-tags reboot
# =============================================================================
- name: Reboot แล้วพิสูจน์ว่าทุกอย่างยังอยู่
  hosts: k8s_nodes
  gather_facts: false
  serial: 1
  tags: reboot
  tasks:
    - name: reboot ทีละเครื่อง
      ansible.builtin.reboot:
        reboot_timeout: 600

    - name: ตรวจว่าของยังอยู่ครบหลัง reboot
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          echo "kernel=$(uname -r)"
          echo "modules=$(lsmod | grep -cE '^overlay|^br_netfilter')"
          echo "fwd=$(sysctl -n net.ipv4.ip_forward)"
          echo "swap=$(free -m | awk '/Swap/{print $2}')"
          echo "selinux=$(getenforce)"
      register: _post
      changed_when: false
      # อ่านอย่างเดียว — ต้องรันแม้ใน --check ไม่งั้นตัวแปรที่ register หายทั้งชุด
      check_mode: false

    - name: ผลหลัง reboot
      ansible.builtin.debug:
        var: _post.stdout_lines

    - name: ทุกข้อต้องผ่าน ไม่งั้นห้ามไปบท 02
      ansible.builtin.assert:
        that:
          - "'modules=2' in _post.stdout"
          - "'fwd=1' in _post.stdout"
          - "'swap=0' in _post.stdout"
          - "'selinux=Permissive' in _post.stdout"
          - "'kernel=' ~ v.KERNEL_UEK in _post.stdout"
        fail_msg: "เครื่องนี้ไม่ผ่านเกณฑ์บท 01 — หยุดแล้วแก้ก่อน"
