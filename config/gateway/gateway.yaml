# =============================================================================
#  Gateway หลักของ MyHR
# =============================================================================
#  ตัวนี้จะได้ LoadBalancer IP หนึ่งตัวจาก Cilium LB-IPAM (192.168.50.200-209)
#  และเป็นทางเข้าเดียวของทุก HTTP/HTTPS service ใน cluster
#
#  microservice ทุกตัวอยู่หลังตัวนี้เป็น ClusterIP ธรรมดา ไม่กิน IP ของ LAN
#  แยกกันด้วย hostname ผ่าน HTTPRoute
#
#  ⚠️ ต้องมี Secret `myhr-wildcard-tls` อยู่ก่อน แล้วค่อย apply ไฟล์นี้
#     ไม่งั้น listener https จะค้างที่ Programmed=False
#     ทาง A (public cert)  : bash config/gateway/import-public-cert.sh ...
#     ทาง B (internal CA)  : kubectl apply -f config/cert-manager/wildcard-cert.yaml
# =============================================================================

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: myhr-gateway
  namespace: envoy-gateway-system
spec:
  gatewayClassName: eg

  listeners:
    # --- HTTP: มีไว้เพื่อ redirect ไป HTTPS อย่างเดียว --------------------
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.myhr.co.th"
      allowedRoutes:
        namespaces:
          from: All          # ให้ทุก namespace ผูก route เข้ามาได้

    # --- HTTPS: ทางเข้าจริง -----------------------------------------------
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.myhr.co.th"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: myhr-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All

# =============================================================================
#  ถ้า public cert ที่มีไม่ใช่ wildcard
# -----------------------------------------------------------------------------
#  hostname ของ listener ไม่จำเป็นต้องเท่ากับชื่อใน cert — listener hostname
#  คุมว่า "HTTPRoute ไหนผูกเข้ามาได้" ส่วน cert คุมว่า "ชื่อไหนเปิดแล้วไม่เตือน"
#
#  ถ้ามี cert รายชื่อหลายใบ ใส่ได้หลายใบใน listener เดียว Envoy จะเลือกตาม SNI:
#
#      certificateRefs:
#        - kind: Secret
#          name: hr-myhr-tls          # cert ของ hr.myhr.co.th
#        - kind: Secret
#          name: api-myhr-tls         # cert ของ api.myhr.co.th
#        - kind: Secret
#          name: myhr-wildcard-tls    # ใบสำรอง สำหรับชื่อที่เหลือ
#
#  ทุกใบต้องอยู่ namespace เดียวกับ Gateway (envoy-gateway-system)
#  ถ้าอยู่ namespace อื่นต้องทำ ReferenceGrant ให้ก่อน ไม่งั้นขึ้น InvalidCertificateRef
#
#  หมายเหตุ: "*.myhr.co.th" ครอบ subdomain ชั้นเดียว ไม่ครอบ apex "myhr.co.th"
#  และไม่ครอบ "a.b.myhr.co.th" — ถ้าต้องใช้ ต้องมีชื่อนั้นใน cert ด้วย
# =============================================================================
#  หมายเหตุเรื่อง allowedRoutes.from: All
# -----------------------------------------------------------------------------
#  ตอนนี้เปิดให้ทุก namespace ผูก route ได้ ซึ่งสะดวกตอนเริ่ม
#  แต่แปลว่าใครก็ตามที่สร้าง HTTPRoute ได้ จะแย่ง hostname กันได้
#
#  เมื่อ namespace เริ่มเยอะขึ้น ให้เปลี่ยนเป็น Selector แล้วติด label
#  ที่ namespace ที่อนุญาต:
#
#      allowedRoutes:
#        namespaces:
#          from: Selector
#          selector:
#            matchLabels:
#              gateway-access: "true"
# =============================================================================
