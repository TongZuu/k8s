# =============================================================================
#  บังคับ HTTP → HTTPS
# =============================================================================
#  ผูกกับ listener "http" ของ Gateway แล้ว redirect ทุก request เป็น HTTPS
#  ทำครั้งเดียวใช้กับทุก hostname — ไม่ต้องทำซ้ำต่อ service
# =============================================================================

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: myhr-gateway
      sectionName: http         # ผูกกับ listener HTTP เท่านั้น

  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
