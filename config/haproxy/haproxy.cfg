# =============================================================================
#  /etc/haproxy/haproxy.cfg
#  วางเหมือนกันทั้ง 3 master — ไม่มีอะไรต่างกันต่อเครื่อง
# =============================================================================
#  หน้าที่: รับ traffic ที่ VIP:8443 แล้วกระจายไป kube-apiserver ทั้ง 3 ตัวที่ :6443
#
#  ทำไมต้อง 8443 ไม่ใช่ 6443:
#    HAProxy รันบนเครื่องเดียวกับ kube-apiserver ซึ่งจอง 6443 ไปแล้ว
#    จึงต้องใช้พอร์ตอื่น แล้วให้ controlPlaneEndpoint ชี้มาที่ VIP:8443
#
#  ทำไมไม่ใช่ 80 แบบ cluster เดิม:
#    พอร์ต 80 สื่อว่าเป็น HTTP ทั้งที่จริงเป็น TLS passthrough
#    ทำให้คนอ่านเข้าใจผิดและชนกับ web server ที่อาจลงทีหลัง
# =============================================================================

global
    log         /dev/log local0
    log         /dev/log local1 notice
    daemon
    maxconn     4000

defaults
    mode                    tcp
    log                     global
    option                  tcplog
    option                  dontlognull
    option                  redispatch
    retries                 3
    timeout connect         10s
    timeout client          86400s
    timeout server          86400s
    timeout check           10s
    maxconn                 3000

#---------------------------------------------------------------------
# frontend — จุดที่ kubectl / kubelet / Cilium ทุกตัวเข้ามา
#---------------------------------------------------------------------
frontend kube-apiserver
    bind                    *:8443
    mode                    tcp
    option                  tcplog
    default_backend         kube-apiserver-backend

#---------------------------------------------------------------------
# backend — kube-apiserver ทั้ง 3 ตัว
#---------------------------------------------------------------------
backend kube-apiserver-backend
    mode                    tcp
    # ตรวจถึงชั้น HTTP ว่า apiserver "พร้อมรับงาน" ไม่ใช่แค่ port เปิด
    # 🔴 ห้ามใส่ option ssl-hello-chk เพิ่ม — มันใช้ร่วมกับ httpchk ไม่ได้ ต้องเลือกอย่างเดียว
    #    ถ้าใส่ทั้งคู่ check ที่ทำงานจริงจะไม่ใช่ /healthz อย่างที่ตั้งใจ กลายเป็นแค่
    #    เช็ค TLS handshake ผ่าน = ส่ง traffic เข้า apiserver ที่ยังไม่พร้อมได้
    # ส่วน TLS ของ check มาจาก check-ssl ที่บรรทัด server ข้างล่างแล้ว
    option                  httpchk GET /healthz
    http-check              expect status 200
    balance                 roundrobin

    # ค่า check: ตรวจทุก 3 วิ · ล้ม 2 ครั้งถือว่าตาย · ผ่าน 2 ครั้งถือว่ากลับมา
    default-server          inter 3s fall 2 rise 2

    server k8s-master01     192.168.50.101:6443 check check-ssl verify none
    server k8s-master02     192.168.50.102:6443 check check-ssl verify none
    server k8s-master03     192.168.50.103:6443 check check-ssl verify none

#---------------------------------------------------------------------
# หน้าสถานะ — เปิดเฉพาะ localhost ห้ามเปิดออกนอกเครื่อง
#   ดูด้วย: curl -s http://127.0.0.1:8404/stats
#---------------------------------------------------------------------
listen stats
    bind                    127.0.0.1:8404
    mode                    http
    stats                   enable
    stats uri               /stats
    stats refresh           10s
