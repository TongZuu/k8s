! =============================================================================
!  /etc/keepalived/keepalived.conf   —   สำหรับ k8s-master01 (192.168.50.101)
! =============================================================================
!  ต่างจากอีกสองเครื่องแค่ 2 บรรทัด: state และ priority
!    master01 : state MASTER  priority 110   ← ไฟล์นี้
!    master02 : state BACKUP  priority 100
!    master03 : state BACKUP  priority  90
!
!  cluster เดิมตั้งทั้ง 3 เครื่องเป็น MASTER priority 100 เท่ากันหมด
!  ซึ่งทำให้แย่ง VIP กันเองตอน network สะดุด — อย่าทำซ้ำ
! =============================================================================

global_defs {
    router_id k8s-master01
    script_user root
    enable_script_security
    ! ไม่ส่งอีเมล — ให้ alert ไปทาง Prometheus แทน
    enable_traps
}

vrrp_script check_apiserver {
    script   "/etc/keepalived/check_apiserver.sh"
    interval 3        ! เรียกทุก 3 วินาที
    timeout  5        ! เกิน 5 วิถือว่าล้ม
    weight  -20       ! ล้มแล้วลด priority 20 → ต่ำกว่าเครื่องถัดไปทันที
    fall     2        ! ล้ม 2 ครั้งติดถึงจะนับว่าตาย
    rise     2        ! ผ่าน 2 ครั้งติดถึงจะนับว่ากลับมา
}

vrrp_instance VI_K8S {
    state             MASTER
    interface         ens192
    virtual_router_id 60
    priority          110
    advert_int        1

    ! ---------------------------------------------------------------------
    !  virtual_router_id 60 — ห้ามซ้ำกับ VRRP instance อื่นใน L2 domain เดียวกัน
    !  cluster ฝึกอบรมเดิมที่ 192.168.50.180-183 ใช้ 51
    !  ถ้าเครื่องพวกนั้นยังเปิดอยู่และเราใช้ 51 ซ้ำ จะแย่ง VIP กัน
    ! ---------------------------------------------------------------------

    authentication {
        auth_type PASS
        auth_pass <VRRP_AUTH_PASS>     ! ← ใส่ค่าจริงจากที่เก็บ secret · ต้องเหมือนกันทั้ง 3 เครื่อง
    }

    virtual_ipaddress {
        192.168.50.100/24 dev ens192
    }

    track_script {
        check_apiserver
    }
}
