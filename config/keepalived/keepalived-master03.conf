! =============================================================================
!  /etc/keepalived/keepalived.conf   —   สำหรับ k8s-master03 (192.168.50.103)
! =============================================================================
!  ต่างจาก master01 แค่ 3 บรรทัด: router_id · state · priority
! =============================================================================

global_defs {
    router_id k8s-master03
    script_user root
    enable_script_security
    enable_traps
}

vrrp_script check_apiserver {
    script   "/etc/keepalived/check_apiserver.sh"
    interval 3
    timeout  5
    weight  -20
    fall     2
    rise     2
}

vrrp_instance VI_K8S {
    state             BACKUP
    interface         ens192
    virtual_router_id 60
    priority          90
    advert_int        1

    authentication {
        auth_type PASS
        auth_pass <VRRP_AUTH_PASS>     ! ← ใส่ค่าจริงจากที่เก็บ secret · ต้องเหมือนกันทั้ง 3 เครื่อง
    }

    virtual_ipaddress {
        192.168.50.100/24 dev ens192
    }

    track_script {
        check_apiserver
    }
}
