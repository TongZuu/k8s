# =============================================================================
#  kubeadm-config.yaml  —  ใช้บน k8s-master01 เท่านั้น (192.168.50.101)
#  API: kubeadm.k8s.io/v1beta4   (v1beta3 ถูกถอดออกแล้วใน 1.36)
# =============================================================================
#  รันด้วย:
#    kubeadm init --config=/root/k8s/config/kubeadm/kubeadm-config.yaml \
#                 --upload-certs \
#                 --skip-phases=addon/kube-proxy
#
#  เก็บไฟล์นี้ลง git — มันคือเอกสารว่า cluster ถูกสร้างด้วยค่าอะไร
# =============================================================================

apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: 192.168.50.101      # IP จริงของ master01 — ไม่ใช่ VIP
  bindPort: 6443
nodeRegistration:
  name: k8s-master01
  criSocket: unix:///run/containerd/containerd.sock
  imagePullPolicy: IfNotPresent
bootstrapTokens:
  # ไม่มี field token เลย = kubeadm สุ่ม token ให้เองตอน init
  # ห้ามใส่ token: "" — v1beta4 แปลงค่าว่างเป็น BootstrapTokenString ไม่ได้ แล้วตายด้วย
  #   the bootstrap token "" was not of the form "\\A([a-z0-9]{6})\\.([a-z0-9]{16})\\z"
  # ถ้าจะกำหนดเอง ต้องเป็นรูป abcdef.0123456789abcdef เท่านั้น
  - ttl: "2h"                           # ของเดิม default 24 ชม. — สั้นกว่านี้ปลอดภัยกว่า
    usages: ["signing", "authentication"]
    groups: ["system:bootstrappers:kubeadm:default-node-token"]

---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: v1.36.3

# --- endpoint ที่ทุก node และ kubeconfig จะชี้มา ------------------------------
# ค่านี้ถูกฝังลงใน certificate — แก้ทีหลังไม่ได้โดยไม่ออก cert ใหม่ทั้งชุด
controlPlaneEndpoint: "192.168.50.100:8443"

networking:
  podSubnet: "10.246.0.0/16"            # Cilium cluster-pool ใช้ค่านี้ด้วย
  serviceSubnet: "10.247.0.0/16"
  dnsDomain: "cluster.local"

apiServer:
  # certSANs — จุดที่พลาดบ่อยที่สุด
  # ต้องมีครบทั้ง VIP (IP + ชื่อ) และ master ทุกตัว (IP + ชื่อ)
  # ลืมตัวใดตัวหนึ่ง = เจอ x509 error ตอนต่อผ่านช่องทางนั้น และต้องออก cert ใหม่
  certSANs:
    - "192.168.50.100"
    - "k8s-vip"
    - "192.168.50.101"
    - "k8s-master01"
    - "192.168.50.102"
    - "k8s-master02"
    - "192.168.50.103"
    - "k8s-master03"
    - "127.0.0.1"
    - "localhost"
    - "kubernetes"
    - "kubernetes.default"
    - "kubernetes.default.svc"
    - "kubernetes.default.svc.cluster.local"
  extraArgs:
    # --- audit log — จำเป็นสำหรับระบบที่เก็บข้อมูลพนักงาน --------------------
    # ต้องครบ 3 อย่างถึงจะได้ log จริง ขาดข้อใดข้อหนึ่ง = ได้โฟลเดอร์ว่าง:
    #   1. audit-policy-file  ไม่มี = apiserver ขึ้นปกติแต่ไม่บันทึกอะไรเลย
    #                         (ได้แค่ warning "No audit policy file provided")
    #   2. extraVolumes ของ policy file  ไม่มี = apiserver อ่านไฟล์ไม่เจอ
    #   3. extraVolumes ของ /var/log/kubernetes  ไม่มี = log ตกอยู่ใน container
    #                         หายทุกครั้งที่ pod restart และมองไม่เห็นจากโฮสต์
    # kubeadm ไม่ mount อะไรพวกนี้ให้อัตโนมัติ mount ให้แค่ /etc/kubernetes/pki
    - name: "audit-policy-file"
      value: "/etc/kubernetes/audit-policy.yaml"
    - name: "audit-log-path"
      value: "/var/log/kubernetes/audit.log"
    - name: "audit-log-maxage"
      value: "30"
    - name: "audit-log-maxbackup"
      value: "10"
    - name: "audit-log-maxsize"
      value: "100"

  # ไฟล์/โฟลเดอร์บนโฮสต์ที่ต้องยื่นเข้าไปใน static pod ของ apiserver
  # 🔴 ต้องมีอยู่จริงบน master **ทุกตัว** ก่อน init และก่อน join
  #    pathType: File = ถ้าไม่มีไฟล์ kubelet จะไม่ยอมสร้าง pod (apiserver ไม่ขึ้น)
  extraVolumes:
    - name: "audit-policy"
      hostPath: "/etc/kubernetes/audit-policy.yaml"
      mountPath: "/etc/kubernetes/audit-policy.yaml"
      readOnly: true
      pathType: File
    - name: "audit-log"
      hostPath: "/var/log/kubernetes"
      mountPath: "/var/log/kubernetes"
      readOnly: false
      pathType: DirectoryOrCreate

controllerManager:
  extraArgs:
    - name: "node-cidr-mask-size"
      value: "24"                       # /24 ต่อ node ให้ตรงกับ Cilium cluster-pool
    # ค่าเริ่มต้นของ kubeadm คือ 127.0.0.1 → Prometheus ที่อยู่บน worker ต่อไม่ถึง
    # อาการ: target down 3 ตัว ด้วย "connection refused" (ยืนยันบน cluster จริง 5 ก.ย. 2026)
    - name: "bind-address"
      value: "0.0.0.0"

scheduler:
  extraArgs:
    # เหตุผลเดียวกับ controllerManager ข้างบน
    - name: "bind-address"
      value: "0.0.0.0"

etcd:
  local:
    # /var/lib/etcd คือ partition แยกที่เราย้ายมาจาก /home ในบทที่ 01
    dataDir: "/var/lib/etcd"
    extraArgs:
      - name: "quota-backend-bytes"
        value: "8589934592"             # 8 GB — default 2 GB เล็กไปสำหรับ cluster ที่อยู่ยาว
      # ค่าเริ่มต้นคือ http://127.0.0.1:2381 → Prometheus ต่อไม่ถึงเหมือนกัน
      # ต้องเปิดพอร์ต 2381/tcp ที่ firewalld ด้วย ไม่งั้นได้ "no route to host" (บท 01)
      - name: "listen-metrics-urls"
        value: "http://0.0.0.0:2381"

---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
# ต้องตรงกับ SystemdCgroup = true ใน containerd (บทที่ 02)
# ถ้าไม่ตรง node จะดูปกติแต่ evict pod มั่วตอนโหลดสูง
cgroupDriver: systemd
serializeImagePulls: false              # ดึง image พร้อมกันได้ — เร็วขึ้นตอน scale up
evictionHard:
  memory.available: "500Mi"
  nodefs.available: "10%"
  imagefs.available: "15%"

# --- log ของ container ---------------------------------------------------------
# stdout/stderr ของทุก pod ถูกเขียนเป็นไฟล์ที่ /var/log/pods/... ซึ่งอยู่บน root
# ไม่ใช่ partition /var/lib/containerd ที่แยกไว้ในบทที่ 01 — ถ้า root เต็ม node ตายทั้งเครื่อง
#
# ค่าสองตัวนี้ตรงกับ default ของ kubelet อยู่แล้ว แต่เขียนไว้ให้ชัดตามกติกาข้อ 1
# ของคู่มือ (ทุกค่ามาจากไฟล์เดียว ห้ามพึ่ง default ที่เปลี่ยนได้ตามเวอร์ชัน)
#
# เพดานจริง = 10Mi × 5 = 50Mi ต่อ container · worker ที่รัน ~150 container ใช้ ~8 GB
# ซึ่งอยู่ในวิสัยของ root 400 GB สบาย ๆ และมี evictionHard nodefs 10% เป็นตาข่ายกันตก
containerLogMaxSize: "10Mi"
containerLogMaxFiles: 5

# =============================================================================
#  หมายเหตุ: ตั้งใจไม่มี KubeProxyConfiguration ในไฟล์นี้
#  เพราะเราไม่ติดตั้ง kube-proxy เลย — Cilium ทำหน้าที่นี้ด้วย eBPF (บทที่ 05)
#  จึงต้องสั่ง --skip-phases=addon/kube-proxy ตอน kubeadm init เสมอ
#
#  ห้ามมี "---" ที่คร่อมไว้กับคอมเมนต์เพียว ๆ ทั้งหัวไฟล์และท้ายไฟล์
#  kubeadm ตัด document ด้วยการหั่นบรรทัด "---" ตรง ๆ (ไม่ได้ parse YAML ก่อน)
#  คอมเมนต์ที่อยู่ก่อน "---" บรรทัดแรกจึงนับเป็น document หนึ่งอันที่ไม่มี kind
#  แล้วฟ้องว่า:
#    invalid configuration for GroupVersionKind /, Kind=:
#    kind and apiVersion is mandatory information that must be specified
#  ข้อความนี้ไม่ได้บอกว่าไฟล์ไหน/บรรทัดไหน — จึงเสียเวลาไล่หานาน
#  หมายเหตุ: kubectl ข้าม document ว่างให้เอง ไฟล์อื่นใน config/ จึงไม่เจอปัญหานี้
# =============================================================================
