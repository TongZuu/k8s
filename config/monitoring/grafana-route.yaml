# =============================================================================
#  เปิด Grafana ผ่าน Gateway — จะได้ไม่ต้อง port-forward ทุกครั้ง
# =============================================================================
#  ⚠️ ตัวนี้เปิด Grafana ให้ทุกคนใน LAN เข้าถึงได้
#     ต้องเปลี่ยนรหัส admin ก่อน apply ไฟล์นี้
#     และควรต่อ LDAP/SSO ขององค์กรแทน local user ในระยะยาว
# =============================================================================

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: myhr-gateway
      namespace: envoy-gateway-system
      sectionName: https

  hostnames:
    - "grafana.myhr.co.th"

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: monitoring-grafana
          port: 80
      timeouts:
        request: 60s        # query ย้อนหลังนาน ๆ ใช้เวลา
