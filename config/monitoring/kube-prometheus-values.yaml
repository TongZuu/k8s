# =============================================================================
#  kube-prometheus-stack — Helm values สำหรับ MyHR
# =============================================================================
#  ข้อจำกัดที่ค่าเหล่านี้ถูกออกแบบมารองรับ:
#    - ไม่มี CSI → ใช้ static local PV ที่ผูกกับ k8s-worker03 (บทที่ 08)
#    - /var/lib/monitoring อยู่บน root partition → ต้องคุม retention ไม่ให้ล้น
#    - ต้อง drain node ทุก 1-2 เดือน → ทุกอย่างที่มีหลาย replica ต้องมี PDB
# =============================================================================

# --- Prometheus ---------------------------------------------------------------
prometheus:
  prometheusSpec:
    # retention 2 ชั้น: ตามเวลา และตามขนาด — ตัวไหนถึงก่อนใช้ตัวนั้น
    # retentionSize ต่ำกว่า PV (150Gi) ไว้ ~20% กันไม่ให้เต็มจนเขียนไม่ได้
    retention: 30d
    retentionSize: "120GiB"

    replicas: 1                    # local PV เป็น RWO จึงมีได้ตัวเดียว

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-storage
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 150Gi

    # เก็บ ServiceMonitor/PrometheusRule จากทุก namespace ไม่ใช่แค่ที่ chart สร้าง
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    resources:
      requests:
        cpu: 500m
        memory: 4Gi
      limits:
        memory: 8Gi

# --- Alertmanager -------------------------------------------------------------
#  🔴 ตั้งใจไม่ใช้ PersistentVolume — อ่านเหตุผลก่อนแก้
#
#  เดิมตรงนี้ขอ PVC 2Gi บน local-storage ซึ่งพังสองชั้น:
#    1. เราสร้าง PV ไว้แค่ 3 ก้อน (prometheus/loki/grafana) ไม่มีก้อนของ Alertmanager
#       PVC 2Gi จึงไปคว้าก้อนของคนอื่นที่เล็กที่สุดที่ใหญ่พอ แล้วไล่แย่งกันเป็นทอด ๆ
#       จนก้อนสุดท้ายไม่เหลือที่ (ดูคำอธิบายเต็มใน config/storage/monitoring-pv.yaml)
#    2. local PV ตรึง pod ไว้ที่ worker03 ทั้ง 2 replica → drain เครื่องเดียวดับทั้งคู่
#       ซึ่งสวนทางกับเหตุผลที่ตั้ง replicas: 2 ตั้งแต่แรก
#
#  Alertmanager เก็บแค่ silence กับสถานะการส่ง และ replica คุยกันผ่าน gossip อยู่แล้ว
#  ตัวที่ restart จะ sync กลับจาก peer เอง → emptyDir พอ และได้ HA ที่จริงกว่าเดิม
alertmanager:
  alertmanagerSpec:
    replicas: 2                    # HA — alert ห้ามหายตอน drain node
    # ไม่มี storage: → chart จะใช้ emptyDir ให้เอง

    # บังคับให้ 2 replica อยู่คนละเครื่อง ไม่งั้น drain ทีเดียวดับทั้งคู่
    # ใช้ required ไม่ใช่ preferred เพราะถ้าแยกเครื่องไม่ได้ก็ไม่ได้ HA อยู่ดี
    # ควรเห็น pod ทั้งสองอยู่คนละ node: kubectl -n monitoring get pod -l app.kubernetes.io/name=alertmanager -o wide
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: alertmanager
            topologyKey: kubernetes.io/hostname
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# --- Grafana ------------------------------------------------------------------
grafana:
  replicas: 1                      # local PV เป็น RWO

  persistence:
    enabled: true
    type: pvc
    storageClassName: local-storage
    accessModes: ["ReadWriteOnce"]
    size: 5Gi

  # รหัสเริ่มต้น — ต้องเปลี่ยนทันทีหลังเข้าครั้งแรก แล้วเก็บลงที่เก็บ secret
  adminPassword: "<GRAFANA_ADMIN_PASSWORD>"

  # ต่อ Loki เป็น data source ให้อัตโนมัติ
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-gateway.monitoring.svc.cluster.local
      access: proxy

  grafana.ini:
    server:
      root_url: "https://grafana.myhr.co.th"
    auth.anonymous:
      enabled: false

# --- node-exporter ------------------------------------------------------------
nodeExporter:
  enabled: true                    # ต้องได้ครบ 6 ตัว รวม master ด้วย

# --- kube-state-metrics -------------------------------------------------------
kube-state-metrics:
  # ต้องเปิด metric ของ PDB และ resourcequota
  # เพราะ alert DeploymentWithoutPDB ที่เราเขียนเองต้องใช้
  metricLabelsAllowlist:
    - deployments=[*]
    - pods=[*]

# --- component ที่ kubeadm จัดการเอง -------------------------------------------
# เปิดให้ scrape ได้ แต่ต้องแน่ใจว่า component bind 0.0.0.0 ไม่ใช่ 127.0.0.1
kubeControllerManager:
  enabled: true
  endpoints: ["192.168.50.101", "192.168.50.102", "192.168.50.103"]
kubeScheduler:
  enabled: true
  endpoints: ["192.168.50.101", "192.168.50.102", "192.168.50.103"]
kubeEtcd:
  enabled: true
  endpoints: ["192.168.50.101", "192.168.50.102", "192.168.50.103"]

# --- kube-proxy: ปิด เพราะเราไม่ได้ติดตั้ง ------------------------------------
# ถ้าไม่ปิด Prometheus จะมี target ที่ down ตลอดเวลาและกลบ alert จริง
kubeProxy:
  enabled: false

# --- ให้ทุกอย่างลงที่ worker03 ที่มี PV อยู่ ------------------------------------
# ไม่ต้องใส่ nodeSelector เพราะ WaitForFirstConsumer จัดการให้
# แต่ใส่ toleration ไว้เผื่อ worker03 ถูก taint ในอนาคต
