# =============================================================================
#  PrometheusRule เฉพาะของ MyHR — 14 alert ที่ chart มาตรฐานไม่มี
# =============================================================================
#  แต่ละข้อมาจากลักษณะของ cluster นี้:
#    - ไม่มี GitOps        → ไม่มีอะไรบังคับให้ Deployment มี PDB / replica ≥ 2
#    - ไม่มี Ksplice       → drain ทุก node ทุก 1-2 เดือน ต้องเหลือ capacity พอเมื่อขาด worker 1 เครื่อง
#    - Oracle Linux        → มี kernel สองสาย (UEK / RHCK) node อาจบูตคนละสาย
#    - cert ของ kubeadm    → อายุ 1 ปี หมดแล้ว apiserver ปฏิเสธทุก component
#    - node ถูกถอดได้      → node object หายไป alert ราย node จะไม่มีอะไรให้ประเมิน
#    - ไม่มี CSI           → Prometheus / Loki / Grafana เก็บข้อมูลบน root partition ของ worker03
#    - Loki มีเพดาน        → เกินเพดาน log ถูกทิ้งโดยไม่มี error ที่ไหน
#    - Kubernetes มีอายุ support ~14 เดือนต่อ minor → ต้องรู้ก่อนหมด และรู้เมื่อมี patch ใหม่
#  คำอธิบายเต็มและสิ่งที่ต้องทำเมื่อดัง: บทที่ 09 หัวข้อ 6
# =============================================================================

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: myhr-cluster-rules
  namespace: monitoring
  labels:
    release: monitoring          # ต้องมี label นี้ Prometheus ถึงจะโหลด rule
spec:
  groups:
    # =========================================================================
    - name: myhr.node-inventory
      rules:

        # --- จำนวน node ต่ำกว่าที่ควรมี ---------------------------------------
        # จับ: node object หายไปจาก cluster (kubectl delete node · VM ถูกลบ · ถอดแล้วไม่ใส่คืน)
        # ทำไมต้องมี: KubeNodeNotReady ของ chart ประเมินเฉพาะ node ที่ยังอยู่ · node ที่หายไป
        #   ไม่มี series ให้ประเมิน และ desired ของ DaemonSet ลดตาม จึงไม่มี alert ไหนดังเลย
        # ถ้าไม่มี: cluster เหลือ node น้อยลง capacity ลดลง โดยไม่มีการแจ้งเตือน
        # เงื่อนไขที่ 2 (absent): kube-state-metrics ไม่ส่งค่า = นับ node ไม่ได้ ให้ดังด้วย
        - alert: NodeCountBelowExpected
          # 6 = master 3 + worker 3 ตาม ansible/inventory.ini
          # 🔴 เพิ่มหรือถอด node ถาวร ต้องแก้เลขนี้ ไม่งั้น alert ดังค้าง
          expr: |
            count(kube_node_info) < 6
            or
            absent(kube_node_info)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "cluster เหลือ node ไม่ครบ 6 เครื่อง (หรือนับไม่ได้)"
            description: >-
              ตรวจด้วย kubectl get nodes เทียบกับ ansible/inventory.ini ว่าเครื่องไหนหายไป
              ถ้าไม่มีใครถอนออก ให้ดูที่ vCenter ว่า VM ยังอยู่ไหม แล้วดู kubelet บนเครื่องนั้น
              ถ้า kubectl get nodes ครบ 6 แต่ alert ยังดัง แปลว่า kube-state-metrics
              ไม่ได้ถูก scrape — ตรวจ target ที่ Prometheus ก่อน อย่าเพิ่งไปหา node

    # =========================================================================
    - name: myhr.rolling-reboot-readiness
      rules:

        # --- Deployment ที่ไม่มี PDB ----------------------------------------
        # จับ: Deployment นอก namespace ระบบ ใน namespace ที่ไม่มี PodDisruptionBudget เลย
        # ถ้าปล่อย: drain node ไล่ pod ของ Deployment นี้ออกได้ทั้งหมดพร้อมกัน → service ดับระหว่าง drain
        - alert: DeploymentWithoutPDB
          expr: |
            count by (namespace, deployment) (
              kube_deployment_spec_replicas{namespace!~"kube-system|monitoring|cert-manager|envoy-gateway-system"}
            )
            unless on (namespace)
            count by (namespace) (kube_poddisruptionbudget_status_desired_healthy)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }} ไม่มี PodDisruptionBudget"
            description: >-
              cluster นี้ไม่มี Ksplice จึงต้อง drain ทุก node ทุก 1-2 เดือน
              Deployment ที่ไม่มี PDB จะดับตอน drain
              แก้โดยเพิ่ม PDB (minAvailable: 1) และตั้ง replica >= 2

        # --- Deployment มี replica เดียว ---------------------------------------
        # จับ: Deployment นอก namespace ระบบที่ replicas = 1
        # ถ้าปล่อย: drain เครื่องที่ pod อยู่ = service ดับจนกว่า pod ใหม่จะขึ้นบนเครื่องอื่น
        #   (PDB ป้องกันไม่ได้ — PDB ที่ห้ามไล่ตัวเดียวจะทำให้ drain ค้างแทน)
        # 🔴 รายการ namespace ที่ยกเว้นต้องตรงกับ DeploymentWithoutPDB ข้างบน
        #    ไม่ตรง = สอง alert รายงานเรื่องเดียวกันไม่ตรงกัน
        - alert: DeploymentSingleReplica
          expr: |
            kube_deployment_spec_replicas{namespace!~"kube-system|monitoring|cert-manager|envoy-gateway-system"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }} มี replica เดียว"
            description: "PDB ช่วยไม่ได้ถ้ามี replica เดียว — ต้องมีอย่างน้อย 2"

        # --- requests รวมใกล้เพดานตอนขาด worker 1 เครื่อง -----------------------
        # worker 3 เครื่อง รวม 48 vCPU / 144 GB · ระหว่าง drain เหลือ 2 เครื่อง = 32 vCPU / 96 GB
        # จับ: requests รวมบน worker เกิน 90% ของ 32 vCPU หรือ 96 GB
        # ถ้าปล่อย: drain แล้ว pod ที่ถูกไล่ไม่มีที่ลง ค้าง Pending และ drain ไม่จบ
        - alert: ClusterCapacityNearNPlusOneLimit
          expr: |
            sum(kube_pod_container_resource_requests{resource="cpu", node=~"k8s-worker.*"}) > (32 * 0.9)
            or
            sum(kube_pod_container_resource_requests{resource="memory", node=~"k8s-worker.*"}) > (96 * 1024 * 1024 * 1024 * 0.9)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "requests รวมเกิน 90% ของเพดาน N+1 (32 vCPU / 96 GB)"
            description: >-
              ถ้าเกินเพดานนี้ การ drain node เพื่อ patch kernel จะทำให้ pod ค้าง Pending
              และ drain ไม่จบ — ต้องลด requests หรือขอ worker เพิ่มก่อนรอบ patch ถัดไป

    # =========================================================================
    - name: myhr.oracle-linux
      rules:

        # --- node บูตคนละ kernel --------------------------------------------
        # จับ: node_uname_info มี release มากกว่า 1 ค่าใน cluster
        # ถ้าปล่อย: node ต่างเครื่องต่าง kernel → eBPF ของ Cilium และ network ทำงานไม่เหมือนกัน
        #   ปัญหาเกิดเฉพาะบางเครื่อง · ดังชั่วคราวระหว่าง rolling reboot เป็นปกติ
        - alert: NodeKernelVersionMismatch
          expr: count(count by (release) (node_uname_info)) > 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "node ใน cluster บูต kernel คนละเวอร์ชัน"
            description: >-
              Oracle Linux มี kernel สองสาย (UEK และ RHCK) ถ้า node บูตคนละตัว
              network และ Cilium จะทำงานต่างกันเป็นรายเครื่อง
              ตรวจด้วย `uname -r` ทุกเครื่อง และยืนยันว่า dnf versionlock ยังอยู่
              ระหว่าง rolling reboot alert นี้ดังชั่วคราวได้ เป็นเรื่องปกติ

    # =========================================================================
    - name: myhr.certificates
      rules:

        # --- cert ที่ client ใช้เข้า apiserver ใกล้หมดอายุ --------------------------
        # จับ: client cert ที่ยังมีการใช้งาน เหลืออายุน้อยกว่า 60 วัน
        # ถ้าปล่อย: cert ของ kubeadm อายุ 1 ปี · หมดแล้ว apiserver ปฏิเสธ kubelet · controller ·
        #   scheduler · kubectl ของ admin → node NotReady ทั้ง cluster สั่งงานอะไรไม่ได้
        - alert: KubeCertificateExpiringSoon
          expr: |
            (apiserver_client_certificate_expiration_seconds_count > 0)
            and on (job)
            histogram_quantile(0.01,
              sum by (job, le) (rate(apiserver_client_certificate_expiration_seconds_bucket[5m]))
            ) < 60 * 60 * 24 * 60
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "certificate ของ cluster เหลืออายุน้อยกว่า 60 วัน"
            description: >-
              ถ้าหมดอายุ apiserver จะปฏิเสธ kubelet และ component ของ control plane
              node จะ NotReady และสั่ง kubectl ไม่ได้
              ตรวจด้วย `kubeadm certs check-expiration` บนทุก master
              แล้วต่ออายุด้วย `kubeadm certs renew all` (ดูบทที่ 12)

    # =========================================================================
    - name: myhr.cilium
      rules:

        # --- Cilium agent ไม่ครบทุก node --------------------------------------
        # จับ: DaemonSet cilium มี pod พร้อมใช้น้อยกว่าที่ควรมี
        # ถ้าปล่อย: node ที่ไม่มี agent ไม่มี pod network · Service · LoadBalancer IP
        #   และไม่มี kube-proxy สำรอง (ไม่ได้ติดตั้ง)
        - alert: CiliumAgentDown
          expr: |
            kube_daemonset_status_number_ready{daemonset="cilium", namespace="kube-system"}
            < kube_daemonset_status_desired_number_scheduled{daemonset="cilium", namespace="kube-system"}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Cilium agent ไม่ครบทุก node"
            description: >-
              Cilium ทำทั้ง CNI, kube-proxy replacement และ LB-IPAM
              node ที่ไม่มี Cilium จะไม่มี pod network และ Service ใช้ไม่ได้
              และไม่มี kube-proxy ให้ถอยกลับเพราะไม่ได้ติดตั้งไว้

    # =========================================================================
    - name: myhr.logging
      rules:

        # --- Loki ทิ้ง log เพราะชนเพดาน --------------------------------------
        # loki-values.yaml ตั้ง ingestion_rate_mb: 10 และ per_stream_rate_limit: 3MB
        # (กันไม่ให้ app ที่ log เยอะเขียน root partition ของ worker03 จนเต็ม)
        # จับ: Loki ทิ้ง log (loki_discarded_samples_total เพิ่มขึ้น)
        # ถ้าปล่อย: log ช่วงนั้นหายถาวร · Loki ตอบ 429 ให้ Alloy ซึ่ง retry แล้วทิ้ง ไม่มี error ที่อื่น
        - alert: LokiDiscardingLogs
          expr: |
            sum by (reason) (rate(loki_discarded_samples_total[10m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Loki กำลังทิ้ง log · เหตุผล: {{ $labels.reason }}"
            description: >-
              log ช่วงนี้หายถาวร ถ้า reason เป็น rate_limited หรือ per_stream_rate_limit
              แปลว่ามี app log เกินโควตา — หาตัวต้นเหตุด้วย
              topk(5, sum by (namespace, app) (rate({namespace=~".+"}[5m]))) ใน Grafana
              แล้วแก้ที่ app ก่อน ค่อยพิจารณาขยายเพดานใน loki-values.yaml

        # --- Loki ไม่ได้รับ log เลย ------------------------------------------
        # จับ: ไม่มี log เข้า Loki 15 นาที
        # สาเหตุที่เป็นไปได้: Alloy ไม่ทำงาน · NODE_NAME ไม่ถูกส่งเข้า Alloy (selector ไม่ match) · Loki ไม่รับ
        # ถ้าปล่อย: ไม่มี log ของช่วงนั้นให้ค้นย้อนหลัง · หน้า log ใน Grafana ว่างโดยไม่มี error
        - alert: LokiNotReceivingLogs
          expr: |
            sum(rate(loki_distributor_lines_received_total[15m])) == 0
          for: 20m
          labels:
            severity: critical
          annotations:
            summary: "Loki ไม่ได้รับ log เลยใน 15 นาทีที่ผ่านมา"
            description: >-
              ไล่ตามลำดับ 1) kubectl -n monitoring get ds alloy ครบ 6/6 ไหม
              2) kubectl -n monitoring logs ds/alloy มี error เรื่อง NODE_NAME หรือ 429 ไหม
              3) Loki pod ขึ้นหรือเปล่า (อยู่บน worker03 — ถ้าเครื่องนั้น reboot อยู่ถือว่าปกติ)

        # --- Alloy ไม่ครบทุก node --------------------------------------------
        # จับ: DaemonSet alloy มี pod พร้อมใช้น้อยกว่าที่ควรมี
        # ถ้าปล่อย: log ของ node ที่ไม่มี Alloy ไม่เข้า Loki · LokiNotReceivingLogs ไม่ดัง
        #   เพราะ node อื่นยังส่งอยู่
        - alert: AlloyDaemonSetIncomplete
          expr: |
            kube_daemonset_status_number_ready{daemonset="alloy", namespace="monitoring"}
            < kube_daemonset_status_desired_number_scheduled{daemonset="alloy", namespace="monitoring"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Alloy ไม่ครบทุก node — log ของบาง node หายไป"
            description: >-
              ต้องได้ครบ 6 ตัว รวม master ทั้ง 3 ด้วย
              ถ้าขาดเฉพาะ master ให้ตรวจ tolerations ใน alloy-values.yaml

    # =========================================================================
    - name: myhr.upgrade
      rules:

        # --- สาย Kubernetes ที่รันอยู่ใกล้หมด support ---------------------------
        # จับ: cluster ยังรัน v1.36.x และวันนี้เลย 90 วันก่อนวันหมด support ของ 1.36 (2027-06-28)
        # ถ้าปล่อย: หลังวันหมด support ไม่มี security patch ของสายนี้อีก · minor upgrade ต้องทำทีละขั้น
        #   (1.36 → 1.37 → 1.38) ยิ่งช้ายิ่งต้องทำหลายรอบ
        # 🔴 ตัวเลขและ regex ผูกกับ K8S_VERSION / K8S_MINOR_EOL ใน docs/versions.env
        #    minor upgrade แล้วต้องแก้ทั้ง 2 alert ข้างล่าง (บทที่ 12 หัวข้อ 5) · validate-repo.sh ตรวจให้
        #    1806364800 = 2027-03-30 00:00 UTC (EOL − 90 วัน) · 1814140800 = 2027-06-28 00:00 UTC (EOL)
        - alert: KubernetesNearEndOfLife
          expr: |
            time() > 1806364800
            and on ()
            count(kubernetes_build_info{job="apiserver", git_version=~"v1\\.36\\..*"}) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Kubernetes 1.36 จะหมด support 2027-06-28 — เหลือไม่ถึง 90 วัน"
            description: >-
              วางแผน minor upgrade เป็น 1.37 ตามบทที่ 12 หัวข้อ 5 (Minor upgrade)
              อ่าน release note ของ 1.37 ก่อน · หลัง upgrade แก้ K8S_MINOR_EOL ใน versions.env
              และตัวเลขใน alert นี้ให้เป็นของสายใหม่

        # --- สาย Kubernetes ที่รันอยู่หมด support แล้ว ----------------------------
        # จับ: cluster ยังรัน v1.36.x หลัง 2027-06-28
        # ถ้าปล่อย: ช่องโหว่ที่พบหลังจากนี้ไม่มี patch ให้ cluster นี้
        - alert: KubernetesEndOfLife
          expr: |
            time() > 1814140800
            and on ()
            count(kubernetes_build_info{job="apiserver", git_version=~"v1\\.36\\..*"}) > 0
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Kubernetes 1.36 หมด support แล้ว (2027-06-28)"
            description: >-
              ไม่มี security patch สำหรับสายนี้อีก — minor upgrade ตามบทที่ 12 หัวข้อ 5

        # --- CronJob version-check ไม่สำเร็จเกิน 3 วัน ----------------------------
        # จับ: version-check (version-check.yaml) ไม่มีรอบที่สำเร็จเกิน 3 วัน หรือไม่มี CronJob เลย
        # ถ้าปล่อย: มี patch ใหม่แล้ว KubernetesPatchAvailable ไม่ดัง เพราะไม่มีตัวไปตรวจ
        - alert: VersionCheckNotRunning
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="monitoring", cronjob="version-check"} > 3 * 86400
            or
            absent(kube_cronjob_info{namespace="monitoring", cronjob="version-check"})
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "version-check ไม่ได้ตรวจ version ของ Kubernetes มาเกิน 3 วัน"
            description: >-
              ดู log รอบล่าสุด: kubectl -n monitoring logs job/$(kubectl -n monitoring get job
              -l batch.kubernetes.io/cronjob-name=version-check -o name | tail -1 | cut -d/ -f2)
              ส่วนใหญ่คือ pod ออก https://dl.k8s.io ไม่ได้ (DNS / ขาออกอินเทอร์เน็ต)
              ถ้าไม่มี CronJob เลย: kubectl apply -f /root/k8s/config/monitoring/version-check.yaml

    # =========================================================================
    - name: myhr.disk
      rules:

        # --- root partition ของ worker03 ใกล้เต็ม -----------------------------
        # จับ: / ของ worker03 (.106) เหลือว่างน้อยกว่า 20%
        # ถ้าปล่อย: /var/lib/monitoring อยู่บน root ร่วมกับ OS และ log · เต็มแล้ว node NotReady
        #   Prometheus · Loki · Grafana หยุดทั้งหมด
        - alert: MonitoringDiskFillingUp
          expr: |
            (
              node_filesystem_avail_bytes{mountpoint="/", instance=~".*106.*"}
              / node_filesystem_size_bytes{mountpoint="/", instance=~".*106.*"}
            ) < 0.20
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "root partition ของ k8s-worker03 เหลือน้อยกว่า 20%"
            description: >-
              /var/lib/monitoring อยู่บน root partition ร่วมกับ log และ OS
              ถ้าเต็ม node จะกลายเป็น NotReady ทั้งเครื่อง
              ลด retention ของ Prometheus/Loki หรือย้ายไป disk แยก
