# =============================================================================
#  PrometheusRule เฉพาะของ MyHR
# =============================================================================
#  11 ข้อนี้ไม่มีใน chart มาตรฐาน เพราะมันมาจากข้อจำกัดที่เราเลือกเอง:
#    - ไม่มี GitOps  → ไม่มีอะไรบังคับให้ manifest มี PDB
#    - ไม่มี Ksplice → ต้อง drain ทุก 1-2 เดือน จึงต้องเผื่อ capacity N+1
#    - Oracle Linux ให้ kernel สองตัว → node อาจบูตคนละตัวโดยไม่มีใครรู้
#    - cluster เดิมตายเพราะ cert หมดอายุ → ต้องเตือนล่วงหน้าหลายเดือน
#    - drain บ่อย → node อาจถูกถอนแล้วลืมใส่คืน โดยที่ทุกหน้าจอยังเขียว
#    - ไม่มี CSI → monitoring ทั้งชุดฝากชีวิตไว้กับ root partition ของ worker03
#    - Loki มีเพดาน ingestion → log หายได้เงียบ ๆ โดยไม่มีอะไรพัง
# =============================================================================

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: myhr-cluster-rules
  namespace: monitoring
  labels:
    release: monitoring          # ต้องมี label นี้ Prometheus ถึงจะเก็บไป
spec:
  groups:
    # =========================================================================
    - name: myhr.node-inventory
      rules:

        # --- node หายไปจากทะเบียนของ cluster ---------------------------------
        # KubeNodeNotReady ของ chart จับได้เฉพาะ "node ที่ยังอยู่แต่ป่วย"
        # ถ้า node object หายไปเลย (kubectl delete node, ถอนเครื่องหลัง drain แล้วลืมใส่คืน,
        # หรือ VM ถูกลบทิ้งที่ vCenter) series ของเครื่องนั้นหายทั้งชุด
        # → ไม่เหลืออะไรให้ KubeNodeNotReady ประเมิน มันจึงหยุดดังแทนที่จะดัง
        # และ desired ของ DaemonSet ก็ลดตามจำนวน node ที่เหลือ
        # → CiliumAgentDown กับ AlloyDaemonSetIncomplete ก็เงียบตามไปด้วย
        # ผลคือ cluster เล็กลงหนึ่งเครื่องโดยที่ทุกหน้าจอเป็นสีเขียว
        - alert: NodeCountBelowExpected
          # 6 = master 3 + worker 3 ตรงกับ ansible/inventory.ini
          # 🔴 ถ้าเพิ่มหรือถอน node ถาวร ต้องแก้เลขนี้ ไม่งั้น alert จะดังค้างตลอด
          #
          # arm ที่สอง (absent) ดักตอน kube-state-metrics ตาย ซึ่งทำให้ count()
          # ไม่คืนอะไรเลย — ถ้ามีแต่ arm แรก ช่วงนั้นจะ "นับ node ไม่ได้" แบบเงียบ ๆ
          # ซึ่งเป็นอาการเดียวกับที่ alert ข้อนี้ตั้งใจกำจัด
          expr: |
            count(kube_node_info) < 6
            or
            absent(kube_node_info)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "cluster เหลือ node ไม่ครบ 6 เครื่อง (หรือนับไม่ได้)"
            description: >-
              ตรวจด้วย kubectl get nodes เทียบกับ ansible/inventory.ini ว่าเครื่องไหนหายไป
              ถ้าไม่มีใครถอนออก ให้ดูที่ vCenter ว่า VM ยังอยู่ไหม แล้วดู kubelet บนเครื่องนั้น
              ถ้า kubectl get nodes ครบ 6 แต่ alert ยังดัง แปลว่า kube-state-metrics
              ไม่ได้ถูก scrape — ตรวจ target ที่ Prometheus ก่อน อย่าเพิ่งไปหา node

    # =========================================================================
    - name: myhr.rolling-reboot-readiness
      rules:

        # --- Deployment ที่ไม่มี PDB ----------------------------------------
        # ถ้า drain node ที่มี pod ของ Deployment นี้อยู่ จะดับทันที
        - alert: DeploymentWithoutPDB
          expr: |
            count by (namespace, deployment) (
              kube_deployment_spec_replicas{namespace!~"kube-system|monitoring|cert-manager|envoy-gateway-system"}
            )
            unless on (namespace)
            count by (namespace) (kube_poddisruptionbudget_status_desired_healthy)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }} ไม่มี PodDisruptionBudget"
            description: >-
              cluster นี้ไม่มี Ksplice จึงต้อง drain ทุก node ทุก 1-2 เดือน
              Deployment ที่ไม่มี PDB จะดับตอน drain
              แก้โดยเพิ่ม PDB (minAvailable: 1) และตั้ง replica >= 2

        # --- replica เดียว = drain แล้วดับแน่นอน ----------------------------
        # 🔴 รายการ namespace ที่ยกเว้นต้องตรงกับ DeploymentWithoutPDB ข้างบนเสมอ
        #    ถ้าไม่ตรง จะได้ alert ที่ขัดกันเอง: เตือนว่า Deployment ของ envoy-gateway-system
        #    มี replica เดียว แต่ไม่เตือนว่ามันไม่มี PDB ทั้งที่เป็นเรื่องเดียวกัน
        #    (เจอจริงตอนต่อเมลได้ครั้งแรก — envoy-gateway-system ดังข้อเดียวโดด ๆ)
        - alert: DeploymentSingleReplica
          expr: |
            kube_deployment_spec_replicas{namespace!~"kube-system|monitoring|cert-manager|envoy-gateway-system"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.deployment }} มี replica เดียว"
            description: "PDB ช่วยไม่ได้ถ้ามี replica เดียว — ต้องมีอย่างน้อย 2"

        # --- capacity ใกล้ชนเพดาน N+1 ---------------------------------------
        # worker 3 เครื่อง รวม 48 vCPU / 144 GB
        # แต่ตอน drain เหลือ 2 เครื่อง → เพดานจริงคือ 32 vCPU / 96 GB
        - alert: ClusterCapacityNearNPlusOneLimit
          # เพดาน N+1: CPU 32 core · MEM 96 GiB — เตือนที่ 90% ของทั้งคู่
          expr: |
            sum(kube_pod_container_resource_requests{resource="cpu", node=~"k8s-worker.*"}) > (32 * 0.9)
            or
            sum(kube_pod_container_resource_requests{resource="memory", node=~"k8s-worker.*"}) > (96 * 1024 * 1024 * 1024 * 0.9)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "requests รวมเกิน 90% ของเพดาน N+1 (32 vCPU / 96 GB)"
            description: >-
              ถ้าเกินเพดานนี้ การ drain node เพื่อ patch kernel จะทำให้ pod ค้าง Pending
              และ drain ไม่จบ — ต้องลด requests หรือขอ worker เพิ่มก่อนรอบ patch ถัดไป

    # =========================================================================
    - name: myhr.oracle-linux
      rules:

        # --- node บูตคนละ kernel --------------------------------------------
        - alert: NodeKernelVersionMismatch
          expr: count(count by (release) (node_uname_info)) > 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "node ใน cluster บูต kernel คนละเวอร์ชัน"
            description: >-
              Oracle Linux ให้ kernel มาสองตัว (UEK และ RHCK) การผสมกันทำให้เกิด
              อาการ network ที่ต่างกันเป็นราย node ซึ่งหาสาเหตุยากมาก
              ตรวจด้วย `uname -r` ทุกเครื่อง และยืนยันว่า dnf versionlock ยังอยู่
              หมายเหตุ: ระหว่าง rolling reboot alert นี้จะดังชั่วคราวเป็นเรื่องปกติ

    # =========================================================================
    - name: myhr.certificates
      rules:

        # --- cert ของ cluster ใกล้หมดอายุ ------------------------------------
        - alert: KubeCertificateExpiringSoon
          expr: |
            (apiserver_client_certificate_expiration_seconds_count > 0)
            and on (job)
            histogram_quantile(0.01,
              sum by (job, le) (rate(apiserver_client_certificate_expiration_seconds_bucket[5m]))
            ) < 60 * 60 * 24 * 60
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "certificate ของ cluster เหลืออายุน้อยกว่า 60 วัน"
            description: >-
              นี่คือสาเหตุที่ cluster เดิมเดินต่อไม่ได้
              ตรวจด้วย `kubeadm certs check-expiration` บนทุก master
              แล้วต่ออายุด้วย `kubeadm certs renew all` (ดูบทที่ 12)

    # =========================================================================
    - name: myhr.cilium
      rules:

        # --- Cilium ล่ม = pod network + Service + LoadBalancer ดับพร้อมกัน ----
        - alert: CiliumAgentDown
          expr: |
            kube_daemonset_status_number_ready{daemonset="cilium", namespace="kube-system"}
            < kube_daemonset_status_desired_number_scheduled{daemonset="cilium", namespace="kube-system"}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Cilium agent ไม่ครบทุก node"
            description: >-
              Cilium ทำทั้ง CNI, kube-proxy replacement และ LB-IPAM
              node ที่ไม่มี Cilium จะไม่มี pod network และ Service ใช้ไม่ได้
              และไม่มี kube-proxy ให้ถอยกลับเพราะไม่ได้ติดตั้งไว้

    # =========================================================================
    - name: myhr.logging
      rules:

        # --- Loki ทิ้ง log เพราะชนเพดาน --------------------------------------
        # loki-values.yaml ตั้ง ingestion_rate_mb: 10 และ per_stream_rate_limit: 3MB ไว้
        # ซึ่งจำเป็น — ไม่งั้น app ที่ log รัวจะกิน root partition ของ worker03 จนเต็ม
        # แต่เวลาเพดานทำงาน Loki ตอบ 429 แล้ว Alloy retry จนยอมแพ้แล้วทิ้งแบบ "เงียบ"
        # ทีม dev จะเห็นแค่ "log บางช่วงหาย" แล้วสรุปว่าระบบ log เชื่อไม่ได้
        - alert: LokiDiscardingLogs
          expr: |
            sum by (reason) (rate(loki_discarded_samples_total[10m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Loki กำลังทิ้ง log · เหตุผล: {{ $labels.reason }}"
            description: >-
              log หายโดยไม่มีใครรู้ ถ้า reason เป็น rate_limited หรือ per_stream_rate_limit
              แปลว่ามี app log รัวเกินโควตา — ไปหาตัวต้นเหตุด้วย
              topk(5, sum by (namespace, app) (rate({namespace=~".+"}[5m]))) ใน Grafana
              แล้วแก้ที่ app ก่อน ค่อยพิจารณาขยายเพดานใน loki-values.yaml

        # --- ไม่มี log เข้าเลย ------------------------------------------------
        # ดักกรณี Alloy พัง, NODE_NAME ไม่ถูกส่งเข้าไปจน selectors ไม่ match อะไรเลย,
        # หรือ Loki ไม่รับ — ทั้งสามอย่างให้ผลเหมือนกันคือ "หน้าจอ log ว่างเปล่า"
        # ซึ่งดูเหมือนระบบเงียบสงบ ทั้งที่จริงคือระบบเก็บ log ตายไปแล้ว
        - alert: LokiNotReceivingLogs
          expr: |
            sum(rate(loki_distributor_lines_received_total[15m])) == 0
          for: 20m
          labels:
            severity: critical
          annotations:
            summary: "Loki ไม่ได้รับ log เลยใน 15 นาทีที่ผ่านมา"
            description: >-
              ไล่ตามลำดับ 1) kubectl -n monitoring get ds alloy ครบ 6/6 ไหม
              2) kubectl -n monitoring logs ds/alloy มี error เรื่อง NODE_NAME หรือ 429 ไหม
              3) Loki pod ขึ้นหรือเปล่า (อยู่บน worker03 — ถ้าเครื่องนั้น reboot อยู่ถือว่าปกติ)

        # --- Alloy ไม่ครบทุก node --------------------------------------------
        # node ที่ไม่มี Alloy = log ของเครื่องนั้นหายไปเงียบ ๆ โดยที่ Loki ยังดูปกติ
        - alert: AlloyDaemonSetIncomplete
          expr: |
            kube_daemonset_status_number_ready{daemonset="alloy", namespace="monitoring"}
            < kube_daemonset_status_desired_number_scheduled{daemonset="alloy", namespace="monitoring"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Alloy ไม่ครบทุก node — log ของบาง node หายไป"
            description: >-
              ต้องได้ครบ 6 ตัว รวม master ทั้ง 3 ด้วย
              ถ้าขาดเฉพาะ master ให้ตรวจ tolerations ใน alloy-values.yaml

    # =========================================================================
    - name: myhr.disk
      rules:

        # --- monitoring กิน root partition จนเต็ม ----------------------------
        - alert: MonitoringDiskFillingUp
          expr: |
            (
              node_filesystem_avail_bytes{mountpoint="/", instance=~".*106.*"}
              / node_filesystem_size_bytes{mountpoint="/", instance=~".*106.*"}
            ) < 0.20
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "root partition ของ k8s-worker03 เหลือน้อยกว่า 20%"
            description: >-
              /var/lib/monitoring อยู่บน root partition ร่วมกับ log และ OS
              ถ้าเต็ม node จะกลายเป็น NotReady ทั้งเครื่อง
              ลด retention ของ Prometheus/Loki หรือย้ายไป disk แยก
