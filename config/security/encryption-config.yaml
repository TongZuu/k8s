# =============================================================================
#  etcd encryption at rest
#  ปลายทาง: /etc/kubernetes/enc/encryption-config.yaml  (chmod 600)
#  ต้องเหมือนกันทั้ง 3 master — key ต่างกันแม้แต่ตัวเดียวจะอ่านของกันไม่ออก
# =============================================================================
#  ⚠️ ถ้า key นี้หาย จะถอดรหัส etcd backup เก่าไม่ได้เลย ไม่มีทางกู้
#     เก็บลงที่เก็บ secret ขององค์กร และเก็บสำเนาออฟไลน์ไว้อีกชุด
#     ห้าม commit ไฟล์ที่ใส่ค่าจริงแล้วลง git
#
#  สร้าง key ด้วย:  head -c 32 /dev/urandom | base64
# =============================================================================

apiVersion: apiserver.config.k8s.io/v1
kind: EncryptionConfiguration
resources:
  - resources:
      - secrets
      - configmaps
    providers:
      # ตัวแรกในลิสต์คือตัวที่ใช้ "เขียน"
      - aescbc:
          keys:
            - name: key1
              secret: <ENCRYPTION_KEY_BASE64>

      # identity = ไม่เข้ารหัส — ต้องอยู่ "ท้ายสุด" เท่านั้น
      # มีไว้ให้ apiserver อ่านของเก่าที่ยังไม่ได้เข้ารหัสได้
      # ห้ามย้ายขึ้นไปอยู่บนสุด ไม่งั้นจะกลายเป็นเขียนแบบไม่เข้ารหัสทั้งหมด
      - identity: {}

# =============================================================================
#  วิธีหมุน key ในอนาคต (ทำใน day-2, บทที่ 12):
#    1. เพิ่ม key2 ไว้ "ใต้" key1 ในลิสต์  → apiserver อ่านได้ทั้งสอง
#    2. restart apiserver ทีละเครื่อง
#    3. สลับให้ key2 ขึ้นมาอยู่บนสุด      → เริ่มเขียนด้วย key ใหม่
#    4. restart apiserver ทีละเครื่องอีกรอบ
#    5. kubectl get secrets -A -o json | kubectl replace -f -   (เขียนทับด้วย key ใหม่)
#    6. ลบ key1 ออก แล้ว restart อีกรอบ
# =============================================================================
