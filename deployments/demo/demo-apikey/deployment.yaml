# =============================================================================
#  demo-apikey — web app ธรรมดาที่ตอบ 200
# =============================================================================
#  จงใจให้ app "โง่" ที่สุด — ไม่มี auth อะไรอยู่ในนี้เลยสักบรรทัด
#  ทั้งหมดที่ตรวจ credential อยู่ที่ Gateway ใน securitypolicy.yaml
#  นั่นคือประเด็นของ demo นี้: app ไม่ต้องรู้เรื่อง JWT/API key
#
#  image เลือก nginx-unprivileged เพราะ node ดึงมาไว้แล้ว (loki-gateway ใช้ตัวเดียวกัน)
#  จึงขึ้นได้ทันทีโดยไม่ต้องรอ pull และรันเป็น non-root ผ่าน PSA restricted ได้
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-apikey
  namespace: myhr-uat
  labels:
    app.kubernetes.io/name: demo-apikey
    app.kubernetes.io/part-of: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-apikey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-apikey
        app.kubernetes.io/part-of: demo
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor      # ไม่มีบรรทัดนี้จะลงได้ node ละตัว — ดู zeeme-ads
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: demo-apikey
      securityContext:
        runAsNonRoot: true
        runAsUser: 101                 # uid ของ nginx-unprivileged
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # readOnlyRootFilesystem — nginx ต้องเขียน 3 ที่นี้ ไม่มีแล้วขึ้นไม่ได้
          volumeMounts:
            - { name: tmp,   mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run,   mountPath: /var/run }
            - { name: page,  mountPath: /usr/share/nginx/html }
          # 🔴 myhr-uat มี ResourceQuota ที่บังคับ limits.cpu แต่ *ไม่มี* LimitRange
          #    ต่างจาก myhr-prod ที่มี myhr-prod-limits คอยเติม default ให้เอง
          #    ไม่ประกาศ limits.cpu ที่นี่ = ReplicaSet สร้าง pod ไม่ได้เลยแม้แต่ตัวเดียว
          #    และ Deployment จะขึ้น 0/2 เงียบ ๆ โดยไม่มี pod ให้ describe ด้วยซ้ำ
          #    (ต้องไปดูที่ `kubectl -n myhr-uat describe rs` ถึงจะเห็น FailedCreate)
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
      volumes:
        - { name: tmp,   emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: run,   emptyDir: {} }
        - name: page
          configMap:
            name: demo-apikey-page
