# หมายเหตุ: ไฟล์นี้ถูก redact ค่า credential ออกแล้ว เก็บไว้เพื่อดูโครงสร้างเท่านั้น ใช้งานจริงไม่ได้
apiVersion: v1
clusters:
- cluster:
    certificate-authority-data: <BASE64_REDACTED>
    server: https://keepalived-vir:80
  name: kubernetes
contexts:
- context:
    cluster: kubernetes
    user: kubernetes-admin
  name: kubernetes-admin@kubernetes
current-context: kubernetes-admin@kubernetes
kind: Config
preferences: {}
users:
- name: kubernetes-admin
  user:
    client-certificate-data: <BASE64_REDACTED>
    client-key-data: <BASE64_REDACTED>
